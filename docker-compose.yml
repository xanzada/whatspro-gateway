version: '3.8'

services:
  whatspro:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:?REDIS_URL must point to the shared OpenBot Redis}
      - NODE_ENV=production
    volumes:
      - whatsapp_auth:/app/whatsapp_auth
    networks:
      - default
      - dokploy-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/detailed').then(async r => { const body = await r.json(); if (!r.ok || body.ok !== true) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
    # Every WhatsApp instance carries its own Chromium, so this container grows
    # with the tenant list and had no ceiling at all: one runaway client could
    # take the host down with Redis, Traefik and the bot on it. Cap it, and let
    # Docker restart this service alone instead of the whole machine dying.
    deploy:
      resources:
        limits:
          memory: ${WHATSPRO_MEMORY_LIMIT:-2560M}
        reservations:
          memory: 512M

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_SOURCE_NAME: whatspro
      BACKUP_GIT_URL: ${BACKUP_GIT_URL:-}
      BACKUP_GIT_BRANCH_PREFIX: snapshot-whatspro
      BACKUP_SSH_PRIVATE_KEY_B64: ${BACKUP_SSH_PRIVATE_KEY_B64:-}
      BACKUP_AGE_RECIPIENT_B64: ${BACKUP_AGE_RECIPIENT_B64:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900}
      REDIS_URL: ${BACKUP_REDIS_URL:-${REDIS_URL:?REDIS_URL must point to the shared OpenBot Redis}}
    volumes:
      - whatsapp_auth:/source/whatsapp_auth:ro
      - backup_state:/work
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 4
      start_period: 2m

volumes:
  whatsapp_auth:
  backup_state:

networks:
  default:
  dokploy-network:
    external: true
