version: '3.8'

services:
  whatspro:
    build: .
    restart: unless-stopped
    depends_on:
      redis_local:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis_local:6379}
      - NODE_ENV=production
    volumes:
      - whatsapp_auth:/app/whatsapp_auth

  redis_local:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - whatspro_redis_data:/data

volumes:
  whatsapp_auth:
  whatspro_redis_data:
