version: "3.8"
services:
  whatspro:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:?REDIS_URL must point to the shared OpenBot Redis}
      - NODE_ENV=production
    volumes:
      - whatsapp_auth:/app/whatsapp_auth
    networks:
      - default
      - dokploy-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/detailed').then(async r => { const body = await r.json(); if (!r.ok || body.ok !== true) process.exit(1); }).catch(() => process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${WHATSPRO_MEMORY_LIMIT:-2560M}
        reservations:
          memory: 512M
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-web.rule=Host(`whatspro.alemi.kz`)
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-web.entrypoints=web
      - traefik.http.services.whatspro-whatspro-rqldzb-3-web.loadbalancer.server.port=3000
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-web.service=whatspro-whatspro-rqldzb-3-web
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-web.middlewares=redirect-to-https@file
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-websecure.rule=Host(`whatspro.alemi.kz`)
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-websecure.entrypoints=websecure
      - traefik.http.services.whatspro-whatspro-rqldzb-3-websecure.loadbalancer.server.port=3000
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-websecure.service=whatspro-whatspro-rqldzb-3-websecure
      - traefik.http.routers.whatspro-whatspro-rqldzb-3-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_SOURCE_NAME: whatspro
      BACKUP_GIT_URL: ${BACKUP_GIT_URL:-}
      BACKUP_GIT_BRANCH_PREFIX: snapshot-whatspro
      BACKUP_SSH_PRIVATE_KEY_B64: ${BACKUP_SSH_PRIVATE_KEY_B64:-}
      BACKUP_AGE_RECIPIENT_B64: ${BACKUP_AGE_RECIPIENT_B64:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900}
      REDIS_URL: ${BACKUP_REDIS_URL:-${REDIS_URL:?REDIS_URL must point to the shared OpenBot Redis}}
    volumes:
      - whatsapp_auth:/source/whatsapp_auth:ro
      - backup_state:/work
    networks:
      - default
      - dokploy-network
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/backup-healthcheck
      interval: 5m
      timeout: 10s
      retries: 4
      start_period: 2m
volumes:
  whatsapp_auth: null
  backup_state: null
networks:
  default: null
  dokploy-network:
    external: true
