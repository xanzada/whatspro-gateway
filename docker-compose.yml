version: '3.8'
services:
  whatspro:
    build: .
    restart: unless-stopped
    depends_on:
      - redis_local
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis_local:6379  # Өз ішіндегі Redis-ке қосылады
      - NODE_ENV=production
      # ... қалғандары ...
    volumes:
      - whatsapp_auth:/app/whatsapp_auth

redis_local:
    image: redis:7-alpine
    restart: always
    volumes:
      - whatspro_redis_data:/data  # Атын өзгерттік

volumes:
  whatsapp_auth:
  whatspro_redis_data: # Атын өзгерттік
