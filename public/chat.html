<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17212b">
  <link rel="icon" href="data:,">
  <title>Оператор чаты</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!--__CHAT_CONFIG__-->
  <style>
    :root { color-scheme:dark; --app-height:100dvh; --app-top:0px; --bg:#0e1621; --panel:#17212b; --hover:#202b36; --input:#1c2733; --line:#273442; --muted:#8b9bb4; --accent:#2b5278; --green:#22c55e; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; overflow:hidden; }
    body { background:var(--bg); color:#f5f5f5; font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,textarea { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .app { position:relative; top:var(--app-top); display:flex; height:var(--app-height); min-height:0; overflow:hidden; }
    .sidebar { width:min(420px,38vw); min-width:320px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); transition:transform .25s ease,opacity .25s ease; }
    .side-head,.chat-head { min-height:70px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); background:rgba(23,33,43,.96); }
    .brand,.identity,.head-actions,.contact-actions { display:flex; align-items:center; gap:10px; min-width:0; }
    .avatar { width:44px; height:44px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:linear-gradient(135deg,#14b8a6,#34d399); }
    .avatar.contact { background:var(--accent); }
    .truncate { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    h1,h2,p { margin:0; }
    h1,h2 { font-size:16px; }
    .eyebrow { margin-top:2px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .dot { display:inline-block; width:7px; height:7px; margin-right:5px; border-radius:50%; background:#34d399; }
    .icon-btn,.send-btn { width:40px; height:40px; border:0; border-radius:50%; display:grid; place-items:center; background:var(--hover); }
    .icon-btn:hover { background:#293747; }
    .icon-btn.danger { color:#fda4af; }
    .icon-btn.refreshing i { animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .filters { padding:12px; border-bottom:1px solid var(--line); }
    .search-wrap { position:relative; }
    .search-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
    .search { width:100%; padding:10px 14px 10px 40px; border:1px solid transparent; border-radius:22px; background:var(--input); color:#fff; outline:0; }
    .search:focus { border-color:#4b7ca8; }
    .tabs { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:10px; padding:4px; border-radius:10px; background:var(--input); }
    .tab { min-width:0; padding:7px 4px; border:0; border-radius:7px; background:transparent; color:var(--muted); font-size:12px; font-weight:750; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .tab[aria-selected="true"] { background:var(--accent); color:#fff; box-shadow:0 2px 8px #0003; }
    .tab.has-sos-alert { background:#7f1d1d; color:#fecaca; animation:sos-tab-alert 1.35s ease-in-out infinite; }
    .tab.has-sos-alert[aria-selected="true"] { background:#b91c1c; color:#fff; }
    @keyframes sos-tab-alert { 0%,100% { box-shadow:0 0 0 0 #ef444400; } 50% { box-shadow:0 0 0 3px #ef444433; } }
    .direct { width:100%; margin-top:8px; padding:9px; border:0; border-radius:9px; background:var(--hover); color:#60a5fa; font-weight:700; }
    .contact-list { flex:1; min-height:0; padding:8px; overflow-y:auto; scroll-behavior:smooth; overscroll-behavior:contain; }
    .contact-item { width:100%; display:grid; grid-template-columns:48px minmax(0,1fr) auto; align-items:center; gap:11px; margin-bottom:5px; padding:11px; border:1px solid transparent; border-radius:13px; background:transparent; text-align:left; }
    .contact-item:hover,.contact-item.active { background:var(--hover); }
    .contact-item.active { border-color:#3c6082; }
    .contact-avatar { position:relative; width:48px; height:48px; display:grid; place-items:center; border-radius:50%; background:#293747; color:var(--muted); }
    .contact-item.new .contact-avatar { background:#10b981; color:#fff; }
    .contact-item.sos { border-color:#ef444433; }
    .contact-item.sos .contact-avatar { background:#7f1d1d; color:#fecaca; }
    .sos-pulse { position:absolute; top:-1px; right:-1px; width:12px; height:12px; border:2px solid var(--panel); border-radius:50%; background:#ef4444; box-shadow:0 0 0 0 #ef444499; animation:sos-pulse 1.25s ease-out infinite; }
    @keyframes sos-pulse { 0% { opacity:1; box-shadow:0 0 0 0 #ef444499; } 70% { opacity:.65; box-shadow:0 0 0 7px #ef444400; } 100% { opacity:1; box-shadow:0 0 0 0 #ef444400; } }
    .contact-copy { min-width:0; }
    .contact-name,.contact-phone,.contact-snippet { display:block; }
    .contact-name { color:#fff; font-size:15px; font-weight:750; }
    .contact-phone { color:#aebccd; font-size:12px; }
    .contact-snippet { margin-top:3px; color:var(--muted); font-size:13px; }
    .contact-meta { align-self:stretch; display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:6px; }
    .contact-time { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
    .badge { max-width:70px; padding:2px 7px; border-radius:10px; background:#10b98122; color:#6ee7b7; font-size:9px; font-weight:800; text-transform:uppercase; }
    .badge.sos-badge { background:#ef444422; color:#fca5a5; }
    .empty { height:100%; display:grid; place-items:center; color:var(--muted); text-align:center; padding:20px; }
    .chat { min-width:0; flex:1; display:flex; flex-direction:column; background:var(--bg); transition:transform .25s ease; }
    .chat-head { flex:0 0 auto; }
    .back { display:none; }
    .active-meta { color:var(--muted); font-size:12px; }
    .lock { display:flex; align-items:center; gap:7px; padding:7px 11px; border:1px solid #f43f5e44; border-radius:18px; background:#f43f5e15; color:#fb7185; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }
    .lock[hidden] { display:none; }
    .messages-viewport { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth; }
    .messages { min-height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:9px; max-width:1050px; margin:0 auto; padding:18px clamp(12px,3vw,32px); }
    .message-row { width:100%; display:flex; }
    .message-row.client { justify-content:flex-start; }
    .message-row.bot,.message-row.operator { justify-content:flex-end; }
    .message-row.system { justify-content:center; }
    .bubble { max-width:min(76%,680px); padding:9px 12px 7px; border-radius:16px; box-shadow:0 2px 5px #0003; overflow:hidden; }
    .client .bubble { border-top-left-radius:4px; background:#182533; }
    .bot .bubble { border-top-right-radius:4px; background:#1e3a5f; }
    .operator .bubble { border-top-right-radius:4px; background:#2b5278; }
    .system .bubble { background:#202b36; color:var(--muted); font-size:12px; text-align:center; }
    .role { margin-bottom:3px; font-size:10px; font-weight:850; letter-spacing:.07em; text-transform:uppercase; }
    .client .role { color:#7dd3fc; }.bot .role { color:#93c5fd; }.operator .role { color:#86efac; }
    .message-text { white-space:pre-wrap; overflow-wrap:anywhere; }
    .bubble-foot { min-height:16px; display:flex; justify-content:flex-end; align-items:center; gap:4px; margin-top:3px; color:#ffffff8c; font-size:10px; font-variant-numeric:tabular-nums; }
    .ticks { letter-spacing:-4px; padding-right:4px; color:#aab7c4; font-size:12px; }
    .ticks.delivered { color:#aab7c4; }
    .ticks.read { color:#53bdeb; }
    .audio-bubble { width:min(370px,82%); }
    .audio-player { display:grid; grid-template-columns:40px minmax(90px,1fr) 34px 38px; align-items:center; gap:8px; }
    .audio-player audio { display:none; }
    .audio-play { position:relative; pointer-events:auto; z-index:2; width:40px; height:40px; border:0; border-radius:50%; background:#eef3f7; color:#182533; cursor:pointer; touch-action:manipulation; }
    .audio-play > * { pointer-events:none; }
    .audio-seek { width:100%; accent-color:#fff; cursor:pointer; }
    .audio-duration { color:#d7e1ec; font-size:11px; font-variant-numeric:tabular-nums; }
    .audio-speed { padding:5px 3px; border:0; border-radius:10px; background:#ffffff20; color:#fff; font-size:11px; font-weight:800; }
    .audio-error { color:#fecaca; font-size:12px; }
    .image-bubble { width:min(420px,82%); padding:7px; }
    .chat-image-link { display:block; position:relative; min-width:120px; min-height:80px; border-radius:11px; overflow:hidden; background:#111827; color:#fecaca; text-decoration:none; }
    .chat-image { display:block; width:100%; max-height:520px; object-fit:contain; border-radius:11px; }
    .image-error { display:none; min-height:80px; padding:18px; align-items:center; justify-content:center; gap:7px; font-size:12px; }
    .chat-image-link.failed .image-error { display:flex; }
    .composer { flex:0 0 auto; padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); border-top:1px solid var(--line); background:var(--panel); }
    .composer-inner { max-width:920px; margin:auto; display:flex; align-items:flex-end; gap:9px; }
    textarea { flex:1; min-height:44px; max-height:120px; padding:11px 15px; resize:none; overflow-y:auto; border:1px solid transparent; border-radius:18px; outline:0; background:var(--input); color:#fff; }
    textarea:focus { border-color:#4b7ca8; }
    .send-btn { flex:0 0 auto; background:#22c55e; color:#fff; }
    .toast { position:fixed; top:max(16px,env(safe-area-inset-top)); left:50%; z-index:100; transform:translate(-50%,-90px); opacity:0; display:flex; align-items:center; gap:8px; max-width:calc(100vw - 28px); padding:11px 17px; border-radius:22px; background:#293747; box-shadow:0 10px 30px #0007; transition:.25s ease; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    ::-webkit-scrollbar { width:5px; height:5px; } ::-webkit-scrollbar-thumb { background:#3b4b5e; border-radius:8px; }
    @media (max-width:768px) {
      .sidebar,.chat { position:absolute; inset:0; width:100%; min-width:0; }
      .sidebar { z-index:10; }.chat { z-index:20; transform:translateX(100%); }
      .app.chat-open .sidebar { transform:translateX(-25%); opacity:.5; }
      .app.chat-open .chat { transform:translateX(0); }
      .back { display:grid; }
      .head-actions { gap:5px; }
      .chat-head { padding:10px; }
      .chat-head .avatar { width:38px; height:38px; }
      .bubble { max-width:88%; }.audio-bubble,.image-bubble { width:min(420px,92%); max-width:92%; }
    }
    @media (max-width:410px) {
      .chat-head h2 { max-width:120px; }.lock { padding:6px 8px; }.lock .lock-label { display:none; }
      .audio-player { grid-template-columns:38px minmax(70px,1fr) 31px 35px; gap:6px; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Chats">
      <header class="side-head">
        <div class="brand"><div class="avatar"><i class="fa-solid fa-headset"></i></div><div class="truncate"><h1 id="instance-title"></h1><div class="eyebrow"><span class="dot"></span><span data-i18n="operator"></span></div></div></div>
        <div class="head-actions"><button class="icon-btn" id="lang-btn" type="button" aria-label="Language">RU</button><button class="icon-btn" id="refresh-btn" type="button" data-i18n-title="refresh"><i class="fa-solid fa-rotate-right"></i></button></div>
      </header>
      <section class="filters">
        <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input class="search" id="search-input" type="search" autocomplete="off" data-i18n-placeholder="search"></div>
        <div class="tabs" id="tabs" role="tablist"></div>
        <button class="direct" id="direct-chat" type="button" hidden></button>
      </section>
      <main class="contact-list" id="contact-list" aria-live="polite"></main>
    </aside>
    <section class="chat" aria-label="Active chat">
      <header class="chat-head">
        <div class="identity">
          <button class="icon-btn back" id="back-btn" type="button" data-i18n-title="back"><i class="fa-solid fa-arrow-left"></i></button>
          <div class="avatar contact"><i class="fa-solid fa-user"></i></div>
          <div class="truncate"><h2 class="truncate" id="active-name"></h2><div class="active-meta truncate" id="active-meta"></div></div>
        </div>
        <div class="head-actions">
          <div class="lock" id="operator-lock" hidden><i class="fa-solid fa-lock"></i><span class="lock-label" data-i18n="botMuted"></span><span id="lock-seconds"></span></div>
          <button class="icon-btn" id="archive-btn" type="button" hidden><i class="fa-solid fa-box-archive"></i></button>
          <button class="icon-btn danger" id="delete-btn" type="button" hidden><i class="fa-solid fa-trash"></i></button>
        </div>
      </header>
      <main class="messages-viewport" id="messages-viewport"><div class="messages" id="messages"></div></main>
      <footer class="composer"><div class="composer-inner"><textarea id="message-input" rows="1" disabled data-i18n-placeholder="reply"></textarea><button class="send-btn" id="send-btn" type="button" disabled data-i18n-title="send"><i class="fa-solid fa-paper-plane"></i></button></div></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/chat-core.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
