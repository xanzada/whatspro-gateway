<!doctype html>
<html lang="kk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Оператор чаты</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b111d;
            --panel: #101826;
            --panel-2: #162234;
            --panel-3: #1d2b3f;
            --line: #27374e;
            --muted: #8ca0ba;
            --text: #f4f7fb;
            --soft: #c9d5e6;
            --green: #10b981;
            --blue: #3b82f6;
            --orange: #f59e0b;
            --red: #ef4444;
            --shadow: 0 20px 60px rgba(0, 0, 0, .28);
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; min-height: 0; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        button, input, textarea { font: inherit; }
        button { border: 0; cursor: pointer; }
        .app {
            display: grid;
            grid-template-columns: 390px minmax(0, 1fr);
            height: 100%;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(59, 130, 246, .08), transparent 260px),
                var(--bg);
        }

        .sidebar {
            min-width: 0;
            min-height: 0;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(16, 24, 38, .98);
        }

        .side-head, .chat-head {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(16, 24, 38, .94);
            backdrop-filter: blur(14px);
        }

        .brand {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .head-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon, .avatar, .empty-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: #0f766e;
            color: white;
            box-shadow: 0 12px 30px rgba(16, 185, 129, .2);
        }

        .brand-text, .chat-title { min-width: 0; }
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0 0 3px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, .12);
        }

        h1, h2, h3, p { margin: 0; }
        h1, .chat-phone {
            overflow: hidden;
            color: var(--text);
            font-size: 19px;
            font-weight: 800;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: var(--panel-2);
            color: var(--soft);
            border: 1px solid var(--line);
        }

        .icon-btn:hover { background: var(--panel-3); color: white; }
        .icon-btn:disabled { cursor: not-allowed; opacity: .5; }

        .lang-toggle {
            min-width: 42px;
            height: 42px;
            padding: 0 10px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: #0f1b2d;
            color: var(--text);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .lang-toggle:hover { background: var(--panel-3); }

        .filters {
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            background: #111c2d;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 5px;
            padding: 5px;
            border: 1px solid #1f3048;
            border-radius: var(--radius);
            background: #0b1422;
        }

        .tab {
            min-height: 42px;
            overflow: hidden;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab.active {
            background: #31445d;
            color: white;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
        }

        .search {
            position: relative;
            margin-top: 16px;
        }

        .search svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f85a1;
            pointer-events: none;
        }

        .search input {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 44px;
            border: 1px solid #2b3d55;
            border-radius: var(--radius);
            outline: none;
            background: #142034;
            color: var(--text);
        }

        .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, .14); }
        .search input::placeholder { color: #71849c; }

        .direct-chat {
            width: 100%;
            min-height: 38px;
            margin-top: 8px;
            padding: 0 12px;
            border: 1px solid #2b3d55;
            border-radius: var(--radius);
            background: #19304c;
            color: #dbeafe;
            font-size: 13px;
            font-weight: 850;
            text-align: left;
        }

        .direct-chat:hover { background: #244766; }
        .direct-chat[hidden] { display: none; }

        .list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding: 8px;
        }

        .chat-item {
            width: 100%;
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            margin: 0 0 6px;
            padding: 12px 10px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: transparent;
            color: inherit;
            cursor: pointer;
            text-align: left;
        }

        .chat-item:hover { background: #152238; }
        .chat-item:focus-visible { outline: 2px solid rgba(59, 130, 246, .75); outline-offset: 2px; }
        .chat-item.active { border-color: #365274; background: #1a2a42; }

        .avatar {
            width: 46px;
            height: 46px;
            background: #263a54;
            box-shadow: none;
            font-weight: 900;
        }

        .avatar.unread {
            background: #0e7490;
            box-shadow: 0 0 0 4px rgba(14, 116, 144, .18);
        }

        .item-body { min-width: 0; }

        .item-top, .badges {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-top { justify-content: space-between; }

        .phone-wrap {
            min-width: 0;
            flex: 1 1 auto;
        }

        .phone {
            min-width: 0;
            overflow: hidden;
            font-size: 15px;
            font-weight: 850;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-phone {
            margin-top: 2px;
            overflow: hidden;
            color: var(--muted);
            font-size: 11px;
            font-weight: 750;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time {
            flex: 0 0 auto;
            color: #7890ab;
            font-size: 12px;
            font-weight: 700;
        }

        .preview {
            overflow: hidden;
            margin-top: 4px;
            color: #9aacbf;
            font-size: 13px;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item.unread .preview { color: #7dd3fc; font-weight: 700; }
        .badges { margin-top: 8px; flex-wrap: wrap; }
        .badge {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            background: rgba(59, 130, 246, .14);
            color: #93c5fd;
            font-size: 11px;
            font-weight: 850;
        }

        .badge.green { background: rgba(16, 185, 129, .13); color: #6ee7b7; }
        .badge.orange { background: rgba(245, 158, 11, .14); color: #fcd34d; }
        .badge.gray { background: rgba(148, 163, 184, .14); color: #cbd5e1; }

        .item-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .chat-action {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            color: #d1fae5;
            border: 1px solid rgba(16, 185, 129, .26);
            background: rgba(16, 185, 129, .12);
        }

        .chat-action:hover { background: rgba(16, 185, 129, .2); color: white; }
        .chat-action:disabled { cursor: not-allowed; opacity: .45; }
        .chat-action svg { width: 18px; height: 18px; }

        .chat-action.delete {
            color: #fecaca;
            border-color: rgba(239, 68, 68, .26);
            background: rgba(239, 68, 68, .12);
        }

        .chat-action.delete:hover { background: rgba(239, 68, 68, .2); color: white; }

        .chat {
            min-width: 0;
            min-height: 0;
            height: 100%;
            max-height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #09101b;
        }

        .back-btn { display: none; }
        .chat-meta { display: none; }

        .lock-pill {
            display: none;
            flex: 0 0 auto;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            padding: 6px 9px;
            border: 1px solid rgba(45, 212, 191, .28);
            border-radius: 999px;
            background: rgba(15, 118, 110, .18);
            color: #99f6e4;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
        }

        .lock-pill.show { display: inline-flex; }

        .messages {
            flex: 1 1 0;
            height: 0;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding: 22px clamp(14px, 3vw, 34px);
            background:
                radial-gradient(circle at 25% 10%, rgba(16, 185, 129, .08), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(245, 158, 11, .06), transparent 24%),
                #09101b;
        }

        .empty {
            min-height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
        }

        .empty-box {
            width: min(360px, 92vw);
            display: grid;
            justify-items: center;
            gap: 12px;
        }

        .empty-icon { background: #172338; box-shadow: none; color: #8aa3bf; }
        .empty h2 { color: var(--text); font-size: 20px; }
        .empty p { line-height: 1.5; }

        .row { display: flex; margin: 0 0 12px; }
        .row.user { justify-content: flex-start; }
        .row.model, .row.operator { justify-content: flex-end; }
        .row.system { justify-content: center; }

        .bubble {
            max-width: min(680px, 78%);
            padding: 11px 13px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            color: #eaf1fb;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
        }

        .user .bubble { background: #162236; border-bottom-left-radius: 3px; }
        .model .bubble { background: #10253a; border-color: rgba(59, 130, 246, .3); border-bottom-left-radius: 3px; }
        .operator .bubble { background: #0f766e; border-color: rgba(45, 212, 191, .25); border-bottom-right-radius: 3px; }
        .system .bubble {
            max-width: min(560px, 90%);
            padding: 8px 11px;
            background: rgba(245, 158, 11, .12);
            border-color: rgba(245, 158, 11, .28);
            color: #fcd34d;
            font-size: 13px;
            text-align: center;
        }

        .bubble-label {
            display: block;
            margin-bottom: 5px;
            color: #93c5fd;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* АУДИО ОЙНАТҚЫШ СТИЛЬДЕРІ */
        .audio-wrap {
            display: block;
            margin-top: 8px;
        }
        .audio-player { display: none; }
        .audio-status {
            min-height: 34px;
            display: flex;
            align-items: center;
            color: #a9bad2;
            font-size: 12px;
            font-weight: 800;
        }
        .wa-audio {
            min-width: 280px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 42px minmax(120px, 1fr) 44px 52px;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 14px;
            background: #075e46;
        }
        .wa-audio.loading { opacity: .72; }
        .audio-play, .audio-speed {
            height: 36px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .18);
            color: #f1fff8;
            font-size: 13px;
            font-weight: 900;
        }
        .audio-play { width: 36px; font-size: 16px; }
        .audio-play:disabled { cursor: default; opacity: .55; }
        .audio-wave {
            height: 30px;
            background:
                repeating-linear-gradient(90deg, rgba(226, 255, 244, .34) 0 3px, transparent 3px 9px);
            mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
            border-radius: 999px;
        }
        .audio-time {
            color: rgba(241, 255, 248, .76);
            font-size: 13px;
            font-weight: 850;
            text-align: right;
        }
        .audio-speed {
            min-width: 48px;
        }
        .audio-bubble { width: min(430px, 90%); max-width: min(430px, 90%); }

        .composer {
            position: sticky;
            bottom: 0;
            z-index: 3;
            flex: 0 0 auto;
            padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            background: rgba(16, 24, 38, .96);
        }

        .composer-box {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 46px;
            gap: 10px;
            align-items: end;
            max-width: 980px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            min-height: 46px;
            max-height: 132px;
            padding: 12px 14px;
            resize: none;
            border: 1px solid #2b3d55;
            border-radius: var(--radius);
            outline: none;
            background: #0e1726;
            color: var(--text);
            line-height: 1.35;
        }

        textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16, 185, 129, .14); }
        textarea:disabled { opacity: .58; }

        .send {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: var(--green);
            color: white;
            box-shadow: 0 14px 30px rgba(16, 185, 129, .2);
        }

        .send:disabled { background: #2a3c55; color: #7d91aa; box-shadow: none; cursor: not-allowed; }
        .empty-action {
            min-height: 38px;
            padding: 0 14px;
            border-radius: var(--radius);
            background: #19304c;
            color: #dbeafe;
            font-size: 13px;
            font-weight: 850;
        }

        .empty-action:hover { background: #244766; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 50;
            max-width: calc(100vw - 32px);
            transform: translateX(-50%) translateY(90px);
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #111c2d;
            color: white;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: .22s ease;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        svg { width: 20px; height: 20px; }

        @media (max-width: 840px) {
            .app { display: block; position: relative; height: 100%; overflow: hidden; }
            .sidebar, .chat { position: absolute; inset: 0; width: 100%; transition: transform .24s ease; }
            .chat { transform: translateX(100%); }
            .app.chat-open .sidebar { transform: translateX(-100%); }
            .app.chat-open .chat { transform: translateX(0); }
            .back-btn { display: grid; }
            .side-head, .chat-head { min-height: 64px; padding-inline: 14px; }
            .filters { padding: 14px; }
            .list { padding: 6px; }
            .messages { padding: 16px 12px; }
            .bubble { max-width: 86%; }
            .audio-bubble { width: min(360px, calc(100vw - 36px)); max-width: min(360px, calc(100vw - 36px)); }
            .composer { padding-inline: 12px; }
            h1, .chat-phone { font-size: 18px; }
            .tab { font-size: 12px; }
            .lang-toggle, .icon-btn { width: 40px; height: 40px; }
            .composer-box { grid-template-columns: minmax(0, 1fr) 44px; }
            .send { width: 44px; height: 44px; }
        }

        @media (max-width: 520px) {
            .side-head, .chat-head { min-height: 58px; gap: 8px; padding: 10px; }
            .brand { gap: 8px; }
            .brand-icon, .avatar, .empty-icon { width: 38px; height: 38px; }
            .avatar { width: 40px; height: 40px; }
            h1, .chat-phone { font-size: 16px; }
            .eyebrow { font-size: 10px; }
            .filters { padding: 10px; }
            .tabs { gap: 3px; padding: 4px; }
            .tab { min-height: 34px; font-size: 11px; font-weight: 850; }
            .search { margin-top: 12px; }
            .search input { height: 40px; font-size: 14px; padding-left: 38px; }
            .search svg { left: 11px; }
            .chat-item { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; padding: 10px 8px; }
            .item-actions { gap: 4px; }
            .chat-action { width: 32px; height: 32px; }
            .phone { font-size: 15px; }
            .preview { font-size: 12px; }
            .time { font-size: 11px; }
            .badge { height: 18px; padding-inline: 6px; font-size: 10px; }
            .head-actions { gap: 6px; }
            .lang-toggle, .icon-btn { width: 36px; height: 36px; min-width: 36px; font-size: 11px; }
            .messages { padding: 10px; font-size: 14px; }
            .bubble { max-width: min(620px, 92%); padding: 9px 10px; font-size: 14px; line-height: 1.38; }
            .audio-bubble { width: calc(100vw - 32px); max-width: calc(100vw - 32px); }
            .audio-player { height: 42px; }
            .audio-wrap { margin-top: 6px; }
            .composer { padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
            textarea { min-height: 42px; padding: 10px 12px; font-size: 14px; }
            .send { width: 42px; height: 42px; }
            .composer-box { grid-template-columns: minmax(0, 1fr) 42px; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar">
            <header class="side-head">
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v6.4a2.8 2.8 0 0 1-2.8 2.8h-4.7L8 20v-4H6.8A2.8 2.8 0 0 1 4 13.2V6.8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                    </div>
                    <div class="brand-text">
                        <p class="eyebrow"><span class="dot"></span><span id="operator-label">Оператор чаты</span></p>
                        <h1 id="instance-title">Кабинет</h1>
                    </div>
                </div>
                <div class="head-actions">
                    <button class="lang-toggle" id="lang-toggle" type="button" data-lang-toggle title="Тілді ауыстыру" aria-label="Тілді ауыстыру">KZ</button>
                    <button class="icon-btn" id="refresh-btn" type="button" title="Жаңарту" aria-label="Жаңарту">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </header>

            <section class="filters">
                <div class="tabs" role="tablist" aria-label="Диалог сүзгісі">
                    <button class="tab" id="tab-new" type="button" data-tab="new">Жаңа хаттар</button>
                    <button class="tab active" id="tab-all" type="button" data-tab="all">Барлығы</button>
                    <button class="tab" id="tab-operator" type="button" data-tab="operator">Оператор</button>
                    <button class="tab" id="tab-archive" type="button" data-tab="archive">Архив</button>
                </div>
                <label class="search">
                    <svg viewBox="0 0 24 24" fill="none"><path d="m21 21-4.35-4.35M10.8 18.1a7.3 7.3 0 1 1 0-14.6 7.3 7.3 0 0 1 0 14.6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <input id="search-input" autocomplete="off" placeholder="Нөмір немесе мәтін бойынша іздеу">
                </label>
                <button class="direct-chat" id="direct-chat-btn" type="button" hidden></button>
            </section>

            <main class="list" id="contact-list"></main>
        </aside>

        <section class="chat">
            <header class="chat-head">
                <div class="brand">
                    <button class="icon-btn back-btn" id="back-btn" type="button" title="Артқа" aria-label="Артқа">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M15 19 8 12l7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div class="avatar" id="active-avatar">WA</div>
                    <div class="chat-title">
                        <div class="chat-phone" id="active-phone">Диалог</div>

    <script>

        const chatConfig = window.__CHAT_CONFIG__ || {};
        const instanceId = (params.get('instance') || chatConfig.instance || 'prestige').trim();
        function sameOriginApiBase(value) {
            try {
                const raw = String(value || '').replace(/\/+$/, '');
                return raw && new URL(raw, window.location.href).origin === window.location.origin ? raw : '';
            } catch {
                return '';
            }

        const apiBase = sameOriginApiBase(chatConfig.apiBase);

        function apiHeaders(extra = {}) {
            return {
                ...(chatToken ? { 'x-chat-token': chatToken, 'x-chat-instance': instanceId } : {}),
                ...extra
            };
        }
        const endpoints = {

            history: '/api/chat/history',
            send: '/api/chat/send',

                placeholder: 'Ответ клиенту через WhatsApp...',

        };

        let lang = localStorage.getItem('operator_chat_lang') === 'ru' ? 'ru' : 'kk';
        let chats = [];
        let activeTab = 'new';
        let activePhone = '';
        let toastTimer = null;
        let isSending = false;
        let isResolving = false;
        let pendingText = '';
        let inboxSignature = '';
        let historySignature = '';
        let isInboxLoading = false;
        let isHistoryLoading = false;
        let operatorLockUntil = 0;
        let isLockLoading = false;
        let lastViewSyncAt = 0;

        function t(key) { return copy[lang][key] || copy.kk[key] || key; }
        function isMobile() { return window.matchMedia('(max-width: 840px)').matches; }

        function showToast(text) {
            clearTimeout(toastTimer);
            toast.textContent = text;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[char]));
        }

        function cleanText(value) {
            return String(value || '')
                .replace(/\[System:[^\]]*\]/gi, '')
                .replace(/\[Оператор:\s*/gi, '')
                .replace(/\[ESCALATE_ADMIN\]/gi, '')
                .replace(/\[menu_link_sent\]/gi, '')
                .replace(/\]$/g, '')
                .trim();
        }

        function formatTime(value) {
            const time = Number(value || 0);
            if (!time || time < 100000000000) return '';
            const date = new Date(time);
            return date.toLocaleTimeString(lang === 'ru' ? 'ru-RU' : 'kk-KZ', { hour: '2-digit', minute: '2-digit' });
        }

        function userIconSvg() { return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.8 20a7.2 7.2 0 0 1 14.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'; }
        function checkIconSvg() { return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m20 6-11 11-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
        function xIconSvg() { return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'; }

        function normalizePhone(value) { return String(value || '').replace(/\D/g, ''); }
        function searchPhoneCandidate() {
            const digits = normalizePhone(searchInput.value);
            return digits.length >= 10 ? digits : '';
        }

        function updateDirectChatButton() {
            const phone = searchPhoneCandidate();
            const alreadyListed = phone && chats.some(chat => normalizePhone(chat.phone) === phone);
            const shouldShow = Boolean(phone && !alreadyListed);
            directChatBtn.hidden = !shouldShow;
            if (shouldShow) directChatBtn.textContent = copy[lang].directOpen(phone);
        }

        function openDirectChatFromSearch() {
            const phone = searchPhoneCandidate();
            if (!phone) return;
            const existing = chats.find(chat => normalizePhone(chat.phone) === phone);
            if (!existing) {
                chats = [{ phone, lastAt: Date.now(), lastText: t('manualChat'), unread: false, viewed: true, hasOperator: false, closed: false }, ...chats];
            }
            activeTab = 'all';
            searchInput.value = '';
            renderList();
            openChat(phone);
        }

        function isChatArchived(chat) { return Boolean(chat && chat.closed); }

        function counts() {
            const active = chats.filter(chat => !isChatArchived(chat));
            const archived = chats.filter(isChatArchived);
            return {
                new: active.filter(chat => chat.unread).length,
                all: active.filter(chat => chat.viewed && !chat.hasOperator).length,
                operator: active.filter(chat => chat.hasOperator).length,
                archive: archived.length
            };
        }

        function filteredChats() {
            const query = searchInput.value.trim().toLowerCase();
            return chats.filter(chat => {
                const archived = isChatArchived(chat);
                if (activeTab === 'archive' && !archived) return false;
                if (activeTab !== 'archive' && archived) return false;
                const isActiveChat = normalizePhone(chat.phone) === activePhone;
                if (isActiveChat && !query) return true;
                if (activeTab === 'new' && !chat.unread) return false;
                if (activeTab === 'all' && (!chat.viewed || chat.hasOperator)) return false;
                if (activeTab === 'operator' && !chat.hasOperator) return false;
                if (!query) return true;
                return String(chat.phone).includes(query)
                    || String(chat.displayName || '').toLowerCase().includes(query)
                    || String(chat.lastText || '').toLowerCase().includes(query);
            });
        }

        function renderTabs() {
            const total = counts();
            for (const tab of document.querySelectorAll('.tab')) {
                const key = tab.dataset.tab;
                tab.classList.toggle('active', key === activeTab);
                tab.textContent = `${copy[lang].tabs[key]} ${total[key] ? total[key] : ''}`.trim();
            }
        }

        function emptyListMarkup() {
            const total = counts();
            const canOpenAll = !searchInput.value.trim() && activeTab === 'new' && total.all > 0;
            const text = activeTab === 'archive'
                ? t('emptyArchive')
                : (canOpenAll ? t('emptyNew') : t('emptySearch'));
            const action = canOpenAll
                ? `<button class="empty-action" type="button" data-switch-tab="all">${escapeHtml(t('openAll'))}</button>`
                : '';

            return `
                <div class="empty">
                    <div class="empty-box">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none"><path d="m21 21-4.35-4.35M10.8 18.1a7.3 7.3 0 1 1 0-14.6 7.3 7.3 0 0 1 0 14.6Z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                        </div>
                        <p>${escapeHtml(text)}</p>
                        ${action}
                    </div>
                </div>`;
        }

        function renderList() {
            const previousTop = listEl.scrollTop;
            renderTabs();
            updateDirectChatButton();
            const items = filteredChats();

            if (!items.length) {
                listEl.innerHTML = emptyListMarkup();
                listEl.scrollTop = previousTop;
                return;
            }

            listEl.innerHTML = items.map(chat => {
                const phone = normalizePhone(chat.phone);
                const active = activePhone === phone ? 'active' : '';
                const unread = chat.unread ? 'unread' : '';
                const archived = isChatArchived(chat);
                const actionDisabled = isResolving ? 'disabled' : '';
                const displayName = String(chat.displayName || '').trim();
                const title = displayName || `+${phone}`;
                const phoneLine = displayName ? `<div class="contact-phone">+${escapeHtml(phone)}</div>` : '';
                
                const badges = [
                    archived ? `<span class="badge gray">${escapeHtml(t('archiveBadge'))}</span>` : '',
                    chat.unread ? `<span class="badge green">${escapeHtml(t('newBadge'))}</span>` : '',
                    chat.hasOperator ? `<span class="badge orange">${escapeHtml(t('operatorBadge'))}</span>` : ''
                ].join('');

                const actions = archived
                    ? `
                        <div class="item-actions">
                            <button class="chat-action restore" type="button" data-chat-action="restore" data-phone="${escapeHtml(phone)}" ${actionDisabled} title="${escapeHtml(t('restoreTitle'))}" aria-label="${escapeHtml(t('restoreTitle'))}">${checkIconSvg()}</button>
                            <button class="chat-action delete" type="button" data-chat-action="delete" data-phone="${escapeHtml(phone)}" ${actionDisabled} title="${escapeHtml(t('deleteTitle'))}" aria-label="${escapeHtml(t('deleteTitle'))}">${xIconSvg()}</button>
                        </div>`
                    : `
                        <div class="item-actions">
                            <button class="chat-action done" type="button" data-chat-action="close" data-phone="${escapeHtml(phone)}" ${actionDisabled} title="${escapeHtml(t('resolveTitle'))}" aria-label="${escapeHtml(t('resolveTitle'))}">${checkIconSvg()}</button>
                        </div>`;

                return `
                    <article class="chat-item ${active} ${unread}" role="button" tabindex="0" data-phone="${escapeHtml(phone)}">
                        <div class="avatar ${unread}">${userIconSvg()}</div>
                        <div class="item-body">
                            <div class="item-top">
                                <div class="phone-wrap">
                                    <div class="phone">${escapeHtml(title)}</div>
                                    ${phoneLine}
                                </div>
                                <div class="time">${escapeHtml(formatTime(chat.lastAt))}</div>
                            </div>
                            <div class="preview">${escapeHtml(chat.lastText || t('noMessage'))}</div>
                            <div class="badges">${badges}</div>
                        </div>
                        ${actions}
                    </article>`;
            }).join('');
            listEl.scrollTop = previousTop;
        }

        // АУДИО ОЙНАТҚЫШ
        function buildAudioHtml(item) {
            const mediaKind = String(item?.mediaKind || item.type || '').toLowerCase();
            const mediaTypeRaw = String(item.mediaType || '').trim();
            const mediaType = (mediaTypeRaw.split(';')[0] || '').replace(/[^\w/+.-]/g, '');
            const hasAudioPayload = Boolean(item.audioMessage || item.data?.message?.audioMessage);
            const isMedia = mediaKind === 'audio' || mediaKind === 'ptt' || mediaType.startsWith('audio/') || hasAudioPayload;
            if (!isMedia) return '';
            
            const rawData = String(item.mediaData || item.body || '');
            const hasInlineAudio = rawData.startsWith('data:audio') || rawData.includes(';base64,') || /^[A-Za-z0-9+/=]{80,}$/.test(rawData);
            const safeMediaType = mediaType || 'audio/ogg';
            const src = hasInlineAudio
                ? (rawData.startsWith('data:') ? rawData : `data:${safeMediaType};base64,${rawData}`)
                : '';
            const messageId = String(item.id || '').replace(/"/g, '&quot;');
            const player = (source) => `
                <div class="wa-audio">
                    <button class="audio-play" type="button" data-audio-play aria-label="Play">▶</button>
                    <div class="audio-wave" aria-hidden="true"></div>
                    <span class="audio-time" data-audio-time>0:00</span>
                    <button class="audio-speed" type="button" data-audio-speed data-speed="1" title="Playback speed" aria-label="Playback speed">1x</button>
                    <audio class="audio-player" preload="metadata" src="${escapeHtml(source)}"></audio>
                </div>`;
            
            return `
                <div class="audio-wrap ${src ? '' : 'loading'}" data-audio-wrapper data-audio-id="${escapeHtml(messageId)}">
                    ${src ? player(src) : `<div class="audio-status" data-audio-status>Аудио жүктелуде...</div>`}
                </div>`;
        }

        function formatAudioTime(value) {
            const seconds = Math.max(0, Math.floor(Number(value) || 0));
            return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
        }

        function syncAudioWidgets() {
            for (const audio of messagesEl.querySelectorAll('audio.audio-player:not([data-bound])')) {
                audio.dataset.bound = '1';
                const widget = audio.closest('.wa-audio');
                const play = widget?.querySelector('[data-audio-play]');
                const time = widget?.querySelector('[data-audio-time]');
                const update = () => {
                    if (time) time.textContent = formatAudioTime(audio.currentTime || audio.duration || 0);
                    if (play) play.textContent = audio.paused ? '▶' : 'Ⅱ';
                };
                audio.addEventListener('loadedmetadata', update);
                audio.addEventListener('timeupdate', update);
                audio.addEventListener('play', update);
                audio.addEventListener('pause', update);
                audio.addEventListener('ended', () => {
                    audio.currentTime = 0;
                    update();
                });
                update();
            }
        }

        async function hydrateAudioPlayers() {
            const wrappers = [...messagesEl.querySelectorAll('[data-audio-wrapper][data-audio-id]:not([data-audio-loaded])')];
            for (const wrapper of wrappers) {
                if (wrapper.querySelector('audio') || !wrapper.dataset.audioId) {
                    wrapper.dataset.audioLoaded = '1';
                    continue;
                }
                wrapper.dataset.audioLoaded = '1';
                try {
                    const data = await fetchJson(`${endpoints.media}/${encodeURIComponent(instanceId)}/${encodeURIComponent(wrapper.dataset.audioId)}`);
                    if (!data.mediaData) throw new Error('MEDIA_EMPTY');
                    wrapper.classList.remove('loading');
                    wrapper.innerHTML = `
                        <div class="wa-audio">
                            <button class="audio-play" type="button" data-audio-play aria-label="Play">▶</button>
                            <div class="audio-wave" aria-hidden="true"></div>
                            <span class="audio-time" data-audio-time>0:00</span>
                            <button class="audio-speed" type="button" data-audio-speed data-speed="1" title="Playback speed" aria-label="Playback speed">1x</button>
                            <audio class="audio-player" preload="metadata" src="${escapeHtml(data.mediaData)}"></audio>
                        </div>`;
                    syncAudioWidgets();
                } catch {
                    const status = wrapper.querySelector('[data-audio-status]');
                    if (status) status.textContent = 'Аудио жүктелмеді. Қайта ашып көріңіз.';
                }
            }
        }

        function audioMarkup(src = '') {
            return `
                <div class="wa-audio ${src ? '' : 'loading'}">
                    <button class="audio-play" type="button" data-audio-play aria-label="Play" ${src ? '' : 'disabled'}>&#9658;</button>
                    <div class="audio-wave" aria-hidden="true"></div>
                    <span class="audio-time" data-audio-time>0:00</span>
                    <button class="audio-speed" type="button" data-audio-speed data-speed="1" title="Playback speed" aria-label="Playback speed">1x</button>
                    <audio class="audio-player" preload="metadata" src="${escapeHtml(src)}"></audio>
                </div>`;
        }

        function buildAudioHtml(item) {
            const mediaKind = String(item?.mediaKind || item.type || '').toLowerCase();
            const mediaType = String(item.mediaType || '').split(';')[0].replace(/[^\w/+.-]/g, '');
            const hasAudioPayload = Boolean(item.audioMessage || item.data?.message?.audioMessage);
            const isAudio = mediaKind === 'audio' || mediaKind === 'ptt' || mediaType.startsWith('audio/') || hasAudioPayload;
            if (!isAudio) return '';

            const rawData = String(item.mediaData || '');
            const hasInlineAudio = rawData.startsWith('data:audio') || rawData.includes(';base64,') || /^[A-Za-z0-9+/=]{80,}$/.test(rawData);
            const src = hasInlineAudio
                ? (rawData.startsWith('data:') ? rawData : `data:${mediaType || 'audio/ogg'};base64,${rawData}`)
                : '';

            return `<div class="audio-wrap ${src ? '' : 'loading'}" data-audio-wrapper data-audio-id="${escapeHtml(item.id || '')}">${audioMarkup(src)}</div>`;
        }

        function syncAudioWidgets() {
            for (const audio of messagesEl.querySelectorAll('audio.audio-player:not([data-bound])')) {
                audio.dataset.bound = '1';
                const widget = audio.closest('.wa-audio');
                const play = widget?.querySelector('[data-audio-play]');
                const time = widget?.querySelector('[data-audio-time]');
                const update = () => {
                    if (time) time.textContent = formatAudioTime(audio.currentTime || audio.duration || 0);
                    if (play) play.innerHTML = audio.paused ? '&#9658;' : '&#10074;&#10074;';
                };
                audio.addEventListener('loadedmetadata', update);
                audio.addEventListener('timeupdate', update);
                audio.addEventListener('play', update);
                audio.addEventListener('pause', update);
                audio.addEventListener('ended', () => {
                    audio.currentTime = 0;
                    update();
                });
                update();
            }
        }

        async function hydrateAudioPlayers() {
            const wrappers = [...messagesEl.querySelectorAll('[data-audio-wrapper][data-audio-id]:not([data-audio-loaded])')];
            for (const wrapper of wrappers) {
                if (wrapper.querySelector('audio')?.getAttribute('src')) {
                    wrapper.dataset.audioLoaded = '1';
                    continue;
                }
                const id = wrapper.dataset.audioId;
                if (!id) continue;
                wrapper.dataset.audioLoaded = '1';
                try {
                    const data = await fetchJson(`${endpoints.media}/${encodeURIComponent(instanceId)}/${encodeURIComponent(id)}`);
                    if (!data.mediaData) throw new Error('MEDIA_EMPTY');
                    wrapper.classList.remove('loading');
                    wrapper.innerHTML = audioMarkup(data.mediaData);
                    syncAudioWidgets();
                } catch {
                    delete wrapper.dataset.audioLoaded;
                    setTimeout(hydrateAudioPlayers, 3000);
                }
            }
        }

        function getHistorySignature(history) {
            if (!history || !history.length) return '__empty__';
            return (history || []).map(item => [
                item.id || '',
                item.createdAt || item.timestamp || '',
                item.role || '',
                item.direction || '',
                item.fromMe === true ? '1' : '0',
                String(item.text || item.body || '').length,
                item.hasMedia ? 'media' : '',
                String(item.mediaData || '').length
            ].join(':')).join('|');
        }

        function renderHistory(history, options = {}) {
            const nextSignature = getHistorySignature(history);
            if (!options.force && nextSignature && nextSignature === historySignature) return;
            historySignature = nextSignature;

            const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;
            const previousTop = messagesEl.scrollTop;
            const previousHeight = messagesEl.scrollHeight;

            if (!history || !history.length) {
                messagesEl.innerHTML = `<div class="empty"><p>${escapeHtml(t('noHistory'))}</p></div>`;
                return;
            }

            messagesEl.innerHTML = history.map(item => {
                const role = String(item.role || '').toLowerCase();
                const rawText = String(item.text || item.body || '');
                const text = cleanText(rawText);
                const audioHtml = buildAudioHtml(item);
                
                if (!text && !audioHtml && !rawText.includes('[System:')) return '';

                const outgoing = item.direction === 'outgoing' || item.fromMe === true || ['assistant', 'model', 'operator'].includes(role);
                const source = String(item.source || '').toLowerCase();
                const isOperator = source === 'operator_panel';
                const isBot = ['assistant', 'model', 'bot'].includes(role) || (outgoing && !isOperator && role !== 'system');

                if (isBot) {
                    const bubbleClass = audioHtml ? 'bubble audio-bubble' : 'bubble';
                    return `<div class="row model"><div class="${bubbleClass}"><span class="bubble-label">Bot</span>${escapeHtml(text)}${audioHtml}</div></div>`;
                }

                if (isOperator) {
                    return `<div class="row operator"><div class="bubble"><span class="bubble-label">Operator</span>${escapeHtml(text)}</div></div>`;
                }

                if (role === 'system') {
                    return `<div class="row system"><div class="bubble">${escapeHtml(text || t('systemDefault'))}</div></div>`;
                }

                const bubbleClass = audioHtml ? 'bubble audio-bubble' : 'bubble';
                return `<div class="row user"><div class="${bubbleClass}">${text ? escapeHtml(text) : ''}${audioHtml}</div></div>`;
            }).join('');
            if (wasNearBottom || options.force) {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            } else {
                messagesEl.scrollTop = previousTop + (messagesEl.scrollHeight - previousHeight);
            }
            syncAudioWidgets();
            hydrateAudioPlayers();
        }

        function updateComposerState() {
            const hasActive = Boolean(activePhone);
            const archived = Boolean(activePhone) && isChatArchived(chats.find(c => c.phone === activePhone));
            inputEl.disabled = !hasActive || isSending || archived;
            sendBtn.disabled = !hasActive || isSending || archived || !inputEl.value.trim();
            inputEl.placeholder = archived ? t('archivedPlaceholder') : t('placeholder');
        }

        function setActiveHeader(phone) {
            const archived = phone ? isChatArchived(chats.find(c => c.phone === phone)) : false;
            const phoneText = phone ? `+${phone}` : t('dialog');
            document.getElementById('active-phone').textContent = phoneText;
            document.getElementById('active-avatar').innerHTML = phone ? userIconSvg() : 'WA';
            document.getElementById('active-meta').textContent = phone
                ? (archived ? t('archiveMeta') : t('selectedMeta'))
                : t('defaultMeta');
        }

        function applyLanguage() {
            document.documentElement.lang = lang === 'ru' ? 'ru' : 'kk';
            document.title = t('title');
            document.getElementById('operator-label').textContent = t('operatorLabel');
            document.getElementById('instance-title').textContent = copy[lang].instanceTitle(instanceId);
            document.querySelector('.tabs').setAttribute('aria-label', t('tabList'));
            searchInput.placeholder = t('search');
            updateDirectChatButton();
            inputEl.placeholder = t('placeholder');
            for (const button of langToggles) {
                button.textContent = lang === 'kk' ? 'KZ' : 'RU';
                button.title = t('langTitle');
            }
            refreshBtn.title = t('refresh');
            backBtn.title = t('back');
            setActiveHeader(activePhone);
            renderList();
            if (!activePhone) {
                messagesEl.innerHTML = `<div class="empty"><div class="empty-box"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v6.4a2.8 2.8 0 0 1-2.8 2.8H13l-5 4v-4H6.8A2.8 2.8 0 0 1 4 13.2V6.8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></div><h2>${escapeHtml(t('selectTitle'))}</h2><p>${escapeHtml(t('selectText'))}</p></div></div>`;
            }
            updateComposerState();
        }

        // REST API
        async function fetchJson(url) {
            const response = await fetch(`${apiBase}${url}`, { credentials: 'same-origin', cache: 'no-store', headers: apiHeaders() });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        async function postJson(url, body) {
            const response = await fetch(`${apiBase}${url}`, {
                method: 'POST',
                credentials: 'same-origin',
                cache: 'no-store',
                headers: apiHeaders({ 'content-type': 'application/json' }),
                body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        async function loadInbox() {
            if (!instanceId || isInboxLoading) return;
            isInboxLoading = true;
            try {
                const data = await fetchJson(`${endpoints.inbox}/${encodeURIComponent(instanceId)}`);
                const nextChats = data.items || [];
                const nextSignature = JSON.stringify(nextChats.map(chat => [
                    normalizePhone(chat.phone),
                    chat.lastAt || chat.updatedAt || 0,
                    chat.lastText || '',
                    chat.displayName || '',
                    chat.unread ? 1 : 0,
                    chat.viewed ? 1 : 0,
                    chat.hasOperator ? 1 : 0,
                    chat.closed ? 1 : 0
                ]));
                if (nextSignature === inboxSignature) return;
                inboxSignature = nextSignature;
                chats = nextChats;
                
                chats.forEach(chat => {
                    if (chat.phone === activePhone) chat.unread = false; 
                });
                
                renderList();
                updateComposerState();
            } catch (error) {
            } finally {
                isInboxLoading = false;
            }
        }

        async function loadHistory() {
            if (!activePhone || isHistoryLoading) return;
            isHistoryLoading = true;
            const requestedPhone = activePhone;
            try {
                const data = await fetchJson(`${endpoints.history}/${encodeURIComponent(instanceId)}/${encodeURIComponent(requestedPhone)}`);
                if (activePhone === data.phone) {
                    renderHistory(data.history || []);
                    updateComposerState();
                    syncViewedState();
                }
            } catch (error) {
            } finally {
                isHistoryLoading = false;
            }
        }

        function syncViewedState() {
            if (!activePhone || Date.now() - lastViewSyncAt < 5000) return;
            lastViewSyncAt = Date.now();
            postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { action: 'view' }).catch(() => {});
        }

        function setOperatorLockTtl(ttl) {
            const seconds = Math.max(0, Math.ceil(Number(ttl) || 0));
            operatorLockUntil = seconds > 0 ? Date.now() + seconds * 1000 : 0;
            renderOperatorLock();
        }

        function renderOperatorLock() {
            if (!lockEl) return;
            const remaining = operatorLockUntil ? Math.max(0, Math.ceil((operatorLockUntil - Date.now()) / 1000)) : 0;
            lockEl.classList.toggle('show', Boolean(activePhone && remaining > 0));
            lockEl.textContent = remaining > 0 ? `Bot sleep ${remaining}s` : '';
        }

        async function loadOperatorLock() {
            if (!activePhone || isLockLoading) {
                renderOperatorLock();
                return;
            }
            isLockLoading = true;
            const requestedPhone = activePhone;
            try {
                const data = await fetchJson(`${endpoints.lock}/${encodeURIComponent(instanceId)}/${encodeURIComponent(requestedPhone)}`);
                if (activePhone === data.phone) setOperatorLockTtl(data.ttl || 0);
            } catch (error) {
            } finally {
                isLockLoading = false;
            }
        }

       function openChat(phone) {
            activePhone = normalizePhone(phone);
            if (!activePhone) return;

            // 🚀 1-ЛОГИКА: "Жаңа" ішінен чатқа кіргенде, автоматты түрде "Бәрі" (all) вкладкасына ауыстыру
            if (activeTab === 'new') {
                activeTab = 'all';
            }

            app.classList.add('chat-open');
            setActiveHeader(activePhone);
            inputEl.style.height = 'auto';
            isSending = false;
            
            const chat = chats.find(c => c.phone === activePhone);
            if (chat) {
                chat.unread = false;
                chat.viewed = true;
            }

            updateComposerState();
            historySignature = '';
            lastViewSyncAt = 0;
            messagesEl.innerHTML = `<div class="empty"><p>${escapeHtml(t('loading'))}</p></div>`;
            renderList();
            postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { action: 'view' })
                .then(loadInbox)
                .catch(() => {});
            loadHistory();
            loadOperatorLock();
            if (!isMobile()) inputEl.focus({ preventScroll: true });
        }

        function closeChat() { app.classList.remove('chat-open'); activePhone = ''; operatorLockUntil = 0; renderOperatorLock(); setActiveHeader(''); renderList(); }

        // АРХИВ ЖӘНЕ ӨШІРУ ЛОГИКАСЫ
        async function runChatAction(action, phone) {
            const cleanPhone = normalizePhone(phone);
            if (!cleanPhone || isResolving) return;

            isResolving = true;
            updateComposerState();

            try {
                await postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(cleanPhone)}`, { action });
                
                if (action === 'close') showToast(t('resolveDone'));
                if (action === 'restore') showToast(t('restoreDone'));
                if (action === 'delete') showToast(t('deleteDone'));

                if (action === 'delete') {
                    chats = chats.filter(chat => normalizePhone(chat.phone) !== cleanPhone);
                } else {
                    const chat = chats.find(item => normalizePhone(item.phone) === cleanPhone);
                    if (chat) chat.closed = action === 'close' ? true : action === 'restore' ? false : chat.closed;
                }
                inboxSignature = '';

                if (activePhone === cleanPhone && (action === 'close' || action === 'delete')) {
                    activePhone = '';
                    app.classList.remove('chat-open');
                    setActiveHeader('');
                    messagesEl.innerHTML = '';
                }
                renderList();
            } catch (err) {
                showToast(t('resolveFailed'));
            } finally {
                isResolving = false;
                loadInbox();
            }
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !activePhone || isSending) return;

            pendingText = text;
            isSending = true;
            messagesEl.insertAdjacentHTML('beforeend', `<div class="row operator"><div class="bubble"><span class="bubble-label">Operator</span>${escapeHtml(text)}</div></div>`);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            updateComposerState();

            try {
                await postJson(`${endpoints.send}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { text });
                isSending = false;
                pendingText = '';
                
                // 🚀 2-ЛОГИКА: Оператор жауап берген сәтте автоматты түрде "Оператор" вкладкасына секіру
                const chat = chats.find(c => c.phone === activePhone);
                if (chat) {
                    chat.hasOperator = true;
                    chat.unread = false;
                }
                setOperatorLockTtl(60);
                activeTab = 'operator';

                loadInbox();
                loadHistory();
                loadOperatorLock();
            } catch (error) {
                isSending = false;
                if (pendingText && !inputEl.value.trim()) inputEl.value = pendingText;
                pendingText = '';
                showToast(t('sendFailed'));
                updateComposerState();
            }
        }

        document.querySelector('.tabs').addEventListener('click', event => {
            const button = event.target.closest('.tab');
            if (!button) return;
            activeTab = button.dataset.tab;
            
            if (activePhone) {
                const chat = chats.find(c => c.phone === activePhone);
                const isArchived = isChatArchived(chat);
                if ((activeTab === 'archive' && !isArchived) || (activeTab !== 'archive' && isArchived)) {
                    activePhone = '';
                    closeChat();
                    setActiveHeader('');
                    messagesEl.innerHTML = '';
                }
            }
            renderList();
        });

        listEl.addEventListener('click', event => {
            const switchButton = event.target.closest('[data-switch-tab]');
            if (switchButton) {
                activeTab = switchButton.dataset.switchTab;
                renderList();
                return;
            }

            const actionButton = event.target.closest('[data-chat-action]');
            if (actionButton) {
                runChatAction(actionButton.dataset.chatAction, actionButton.dataset.phone);
                return;
            }

            const item = event.target.closest('.chat-item');
            if (item) openChat(item.dataset.phone);
        });

        messagesEl.addEventListener('click', event => {
            const playButton = event.target.closest('[data-audio-play]');
            if (playButton) {
                const audio = playButton.closest('.wa-audio')?.querySelector('audio');
                if (!audio) return;
                for (const other of messagesEl.querySelectorAll('audio.audio-player')) {
                    if (other !== audio) other.pause();
                }
                if (audio.paused) audio.play().catch(() => {});
                else audio.pause();
                return;
            }

            const speedButton = event.target.closest('[data-audio-speed]');
            if (!speedButton) return;

            const speeds = [1, 1.5, 2];
            const current = Number(speedButton.dataset.speed || 1);
            const next = speeds[(speeds.indexOf(current) + 1) % speeds.length] || 1;
            const wrapper = speedButton.closest('.wa-audio') || speedButton.closest('[data-audio-wrapper]');
            const audio = wrapper?.querySelector('audio');
            if (audio) audio.playbackRate = next;
            speedButton.dataset.speed = String(next);
            speedButton.textContent = `${String(next).replace('.', ',')}x`;
        });

        searchInput.addEventListener('input', () => renderList());
        searchInput.addEventListener('keydown', event => {
            if (event.key !== 'Enter') return;
            if (!searchPhoneCandidate()) return;
            event.preventDefault();
            openDirectChatFromSearch();
        });

        directChatBtn.addEventListener('click', openDirectChatFromSearch);
        refreshBtn.addEventListener('click', () => {
            inboxSignature = '';
            historySignature = '';
            loadInbox();
            loadHistory();
        });
        backBtn.addEventListener('click', closeChat);
        sendBtn.addEventListener('click', sendMessage);

        for (const button of langToggles) button.addEventListener('click', () => {
            lang = lang === 'kk' ? 'ru' : 'kk';
            localStorage.setItem('operator_chat_lang', lang);
            applyLanguage();
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = `${Math.min(inputEl.scrollHeight, 132)}px`;
            updateComposerState();
        });

        inputEl.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        applyLanguage();
        updateComposerState();
        loadInbox();
        
        setInterval(() => {
            loadInbox();
            if (activePhone) loadHistory();
            if (activePhone) loadOperatorLock();
        }, 3000);

        setInterval(renderOperatorLock, 1000);

    </script>
</body>
</html>
