<!doctype html>
<html lang="kk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Оператор чаты</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b111d;
            --panel: #101826;
            --panel-2: #162234;
            --panel-3: #1d2b3f;
            --line: #27374e;
            --muted: #8ca0ba;
            --text: #f4f7fb;
            --soft: #c9d5e6;
            --green: #10b981;
            --blue: #3b82f6;
            --orange: #f59e0b;
            --red: #ef4444;
            --shadow: 0 20px 60px rgba(0, 0, 0, .28);
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; min-height: 0; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        button, input, textarea { font: inherit; }
        button { border: 0; cursor: pointer; }
        .app {
            display: grid;
            grid-template-columns: 390px minmax(0, 1fr);
            height: 100%;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(59, 130, 246, .08), transparent 260px),
                var(--bg);
        }

        .sidebar {
            min-width: 0;
            min-height: 0;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(16, 24, 38, .98);
        }

        .side-head, .chat-head {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(16, 24, 38, .94);
            backdrop-filter: blur(14px);
        }

        .brand {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .head-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon, .avatar, .empty-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: #0f766e;
            color: white;
            box-shadow: 0 12px 30px rgba(16, 185, 129, .2);
        }

        .brand-text, .chat-title { min-width: 0; }
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0 0 3px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, .12);
        }

        h1, h2, h3, p { margin: 0; }
        h1, .chat-phone {
            overflow: hidden;
            color: var(--text);
            font-size: 19px;
            font-weight: 800;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: var(--panel-2);
            color: var(--soft);
            border: 1px solid var(--line);
        }

        .icon-btn:hover { background: var(--panel-3); color: white; }
        .icon-btn:disabled { cursor: not-allowed; opacity: .5; }

        .lang-toggle {
            min-width: 42px;
            height: 42px;
            padding: 0 10px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: #0f1b2d;
            color: var(--text);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .lang-toggle:hover { background: var(--panel-3); }

        .filters {
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            background: #111c2d;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 5px;
            padding: 5px;
            border: 1px solid #1f3048;
            border-radius: var(--radius);
            background: #0b1422;
        }

        .tab {
            min-height: 42px;
            overflow: hidden;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab.active {
            background: #31445d;
            color: white;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
        }

        .search {
            position: relative;
            margin-top: 16px;
        }

        .search svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f85a1;
            pointer-events: none;
        }

        .search input {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 44px;
            border: 1px solid #2b3d55;
            border-radius: var(--radius);
            outline: none;
            background: #142034;
            color: var(--text);
        }

        .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, .14); }
        .search input::placeholder { color: #71849c; }

        .direct-chat {
            width: 100%;
            min-height: 38px;
            margin-top: 8px;
            padding: 0 12px;
            border: 1px solid #2b3d55;
            border-radius: var(--radius);
            background: #19304c;
            color: #dbeafe;
            font-size: 13px;
            font-weight: 850;
            text-align: left;
        }

        .direct-chat:hover { background: #244766; }
        .direct-chat[hidden] { display: none; }

        .list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding: 8px;
        }

        .chat-item {
            width: 100%;
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            margin: 0 0 6px;
            padding: 12px 10px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: transparent;
            color: inherit;
            cursor: pointer;
            text-align: left;
        }

        .chat-item:hover { background: #152238; }
        .chat-item:focus-visible { outline: 2px solid rgba(59, 130, 246, .75); outline-offset: 2px; }
        .chat-item.active { border-color: #365274; background: #1a2a42; }

        .avatar {
            width: 46px;
            height: 46px;
            background: #263a54;
            box-shadow: none;
            font-weight: 900;
        }

        .avatar.unread {
            background: #0e7490;
            box-shadow: 0 0 0 4px rgba(14, 116, 144, .18);
        }

        .item-body { min-width: 0; }

        .item-top, .badges {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-top { justify-content: space-between; }

        .phone-wrap {
            min-width: 0;
            flex: 1 1 auto;
        }

        .phone {
            min-width: 0;
            overflow: hidden;
            font-size: 15px;
            font-weight: 850;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-phone {
            margin-top: 2px;
            overflow: hidden;
            color: var(--muted);
            font-size: 11px;
            font-weight: 750;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time {
            flex: 0 0 auto;
            color: #7890ab;
            font-size: 12px;
            font-weight: 700;
        }

        .preview {
            overflow: hidden;
            margin-top: 4px;
            color: #9aacbf;
            font-size: 13px;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item.unread .preview { color: #7dd3fc; font-weight: 700; }
        .badges { margin-top: 8px; flex-wrap: wrap; }
        .badge {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            background: rgba(59, 130, 246, .14);
            color: #93c5fd;
            font-size: 11px;
            font-weight: 850;
        }

        .badge.green { background: rgba(16, 185, 129, .13); color: #6ee7b7; }
        .badge.orange { background: rgba(245, 158, 11, .14); color: #fcd34d; }
        .badge.gray { background: rgba(148, 163, 184, .14); color: #cbd5e1; }

        .item-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .chat-action {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            color: #d1fae5;
            border: 1px solid rgba(16, 185, 129, .26);
            background: rgba(16, 185, 129, .12);
        }

        .chat-action:hover { background: rgba(16, 185, 129, .2); color: white; }
        .chat-action:disabled { cursor: not-allowed; opacity: .45; }
        .chat-action svg { width: 18px; height: 18px; }

        .chat-action.delete {
            color: #fecaca;
            border-color: rgba(239, 68, 68, .26);
            background: rgba(239, 68, 68, .12);
        }

        .chat-action.delete:hover { background: rgba(239, 68, 68, .2); color: white; }

        .chat {
            min-width: 0;
            min-height: 0;
            height: 100%;
            max-height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #09101b;
        }

        .back-btn { display: none; }
        .chat-meta { display: none; }

        .lock-pill {
            display: none;
            flex: 0 0 auto;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            padding: 6px 9px;
            border: 1px solid rgba(45, 212, 191, .28);
            border-radius: 999px;
            background: rgba(15, 118, 110, .18);
            color: #99f6e4;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
        }

        .lock-pill.show { display: inline-flex; }

        .messages {
            flex: 1 1 0;
            height: 0;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding: 22px clamp(14px, 3vw, 34px);
            background:
                radial-gradient(circle at 25% 10%, rgba(16, 185, 129, .08), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(245, 158, 11, .06), transparent 24%),
                #09101b;
        }

        .empty {
            min-height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
        }

        .empty-box {
            width: min(360px, 92vw);
            display: grid;
            justify-items: center;
            gap: 12px;
        }

        .empty-icon { background: #172338; box-shadow: none; color: #8aa3bf; }
        .empty h2 { color: var(--text); font-size: 20px; }
        .empty p { line-height: 1.5; }

        .row { display: flex; margin: 0 0 12px; }
        .row.user { justify-content: flex-start; }
        .row.model, .row.operator { justify-content: flex-end; }
        .row.system { justify-content: center; }

       .row { 
    display: flex; 
    margin: 0 0 12px; 
}
.row.user { justify-content: flex-start; }
.row.model, .row.operator { justify-content: flex-end; }
.row.system { justify-content: center; }

.bubble {
    max-width: min(680px, 78%);
    padding: 11px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    color: #eaf1fb;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
}

.user .bubble { background: #162236; border-bottom-left-radius: 3px; }
.model .bubble { background: #10253a; border-color: rgba(59, 130, 246, .3); border-bottom-left-radius: 3px; }
.operator .bubble { background: #0f766e; border-color: rgba(45, 212, 191, .25); border-bottom-right-radius: 3px; }

.bubble:has(.audio-wrap) {
    width: min(340px, calc(100vw - 32px));
    max-width: min(340px, calc(100vw - 32px));
    padding: 7px 9px;
}

.audio-wrap {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    margin: 2px 0 0;
    overflow: visible;
    white-space: normal;
}

.audio-player {
    display: block;
    width: 100%;
    min-width: 250px;
    max-width: 100%;
    height: 42px;
    margin: 0;
    outline: none;
}

@media (max-width: 520px) {
    .bubble {
        max-width: calc(100vw - 32px);
        padding: 9px 10px;
        font-size: 14px;
        line-height: 1.38;
    }

    .bubble:has(.audio-wrap) {
        width: calc(100vw - 32px);
        max-width: calc(100vw - 32px);
    }

    .audio-player {
        min-width: 0;
        width: 100%;
        height: 42px;
    }
}

        .composer {
            position: sticky;
            bottom: 0;
            z-index: 3;
            flex: 0 0 auto;
            padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            background: rgba(16, 24, 38, .96);
        }

        .composer-box {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 46px;
            gap: 10px;
            align-items: end;
            max-width: 980px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            min-height: 46px;
            max-height: 132px;
            padding: 12px 14px;
            resize: none;
            border: 1px solid #2b3d55;
            border-radius: var(--radius);
            outline: none;
            background: #0e1726;
            color: var(--text);
            line-height: 1.35;
        }

        textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16, 185, 129, .14); }
        textarea:disabled { opacity: .58; }

        .send {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: var(--green);
            color: white;
            box-shadow: 0 14px 30px rgba(16, 185, 129, .2);
        }

        .send:disabled { background: #2a3c55; color: #7d91aa; box-shadow: none; cursor: not-allowed; }
        .empty-action {
            min-height: 38px;
            padding: 0 14px;
            border-radius: var(--radius);
            background: #19304c;
            color: #dbeafe;
            font-size: 13px;
            font-weight: 850;
        }

        .empty-action:hover { background: #244766; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 50;
            max-width: calc(100vw - 32px);
            transform: translateX(-50%) translateY(90px);
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #111c2d;
            color: white;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: .22s ease;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        svg { width: 20px; height: 20px; }

        @media (max-width: 840px) {
            .app { display: block; position: relative; height: 100dvh; overflow: hidden; }
            .sidebar, .chat { position: absolute; inset: 0; width: 100%; transition: transform .24s ease; }
            .chat { transform: translateX(100%); }
            .app.chat-open .sidebar { transform: translateX(-100%); }
            .app.chat-open .chat { transform: translateX(0); }
            .back-btn { display: grid; }
            .side-head, .chat-head { min-height: 64px; padding-inline: 14px; }
            .filters { padding: 14px; }
            .list { padding: 6px; }
            .messages { padding: 16px 12px; }
            .bubble { max-width: 86%; }
            .composer { padding-inline: 12px; }
            h1, .chat-phone { font-size: 18px; }
            .tab { font-size: 12px; }
            .lang-toggle, .icon-btn { width: 40px; height: 40px; }
            .composer-box { grid-template-columns: minmax(0, 1fr) 44px; }
            .send { width: 44px; height: 44px; }
        }

        @media (max-width: 520px) {
            .side-head, .chat-head { min-height: 58px; gap: 8px; padding: 10px; }
            .brand { gap: 8px; }
            .brand-icon, .avatar, .empty-icon { width: 38px; height: 38px; }
            .avatar { width: 40px; height: 40px; }
            h1, .chat-phone { font-size: 16px; }
            .eyebrow { font-size: 10px; }
            .filters { padding: 10px; }
            .tabs { gap: 3px; padding: 4px; }
            .tab { min-height: 34px; font-size: 11px; font-weight: 850; }
            .search { margin-top: 12px; }
            .search input { height: 40px; font-size: 14px; padding-left: 38px; }
            .search svg { left: 11px; }
            .chat-item { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; padding: 10px 8px; }
            .item-actions { gap: 4px; }
            .chat-action { width: 32px; height: 32px; }
            .phone { font-size: 15px; }
            .preview { font-size: 12px; }
            .time { font-size: 11px; }
            .badge { height: 18px; padding-inline: 6px; font-size: 10px; }
            .head-actions { gap: 6px; }
            .lang-toggle, .icon-btn { width: 36px; height: 36px; min-width: 36px; font-size: 11px; }
            .messages { padding: 10px; font-size: 14px; }
            .bubble { max-width: min(620px, 92%); padding: 9px 10px; font-size: 14px; line-height: 1.38; }
            .composer { padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
            textarea { min-height: 42px; padding: 10px 12px; font-size: 14px; }
            .send { width: 42px; height: 42px; }
            .composer-box { grid-template-columns: minmax(0, 1fr) 42px; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar">
            <header class="side-head">
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v6.4a2.8 2.8 0 0 1-2.8 2.8h-4.7L8 20v-4H6.8A2.8 2.8 0 0 1 4 13.2V6.8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                    </div>
                    <div class="brand-text">
                        <p class="eyebrow"><span class="dot"></span><span id="operator-label">Оператор чаты</span></p>
                        <h1 id="instance-title">Кабинет</h1>
                    </div>
                </div>
                <div class="head-actions">
                    <button class="lang-toggle" id="lang-toggle" type="button" data-lang-toggle title="Тілді ауыстыру" aria-label="Тілді ауыстыру">KZ</button>
                    <button class="icon-btn" id="refresh-btn" type="button" title="Жаңарту" aria-label="Жаңарту">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </header>

            <section class="filters">
                <div class="tabs" role="tablist" aria-label="Диалог сүзгісі">
                    <button class="tab" id="tab-new" type="button" data-tab="new">Жаңа хаттар</button>
                    <button class="tab active" id="tab-all" type="button" data-tab="all">Барлығы</button>
                    <button class="tab" id="tab-operator" type="button" data-tab="operator">Оператор</button>
                    <button class="tab" id="tab-archive" type="button" data-tab="archive">Архив</button>
                </div>
                <label class="search">
                    <svg viewBox="0 0 24 24" fill="none"><path d="m21 21-4.35-4.35M10.8 18.1a7.3 7.3 0 1 1 0-14.6 7.3 7.3 0 0 1 0 14.6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <input id="search-input" autocomplete="off" placeholder="Нөмір немесе мәтін бойынша іздеу">
                </label>
                <button class="direct-chat" id="direct-chat-btn" type="button" hidden></button>
            </section>

            <main class="list" id="contact-list"></main>
        </aside>

        <section class="chat">
            <header class="chat-head">
                <div class="brand">
                    <button class="icon-btn back-btn" id="back-btn" type="button" title="Артқа" aria-label="Артқа">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M15 19 8 12l7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div class="avatar" id="active-avatar">WA</div>
                    <div class="chat-title">
                        <div class="chat-phone" id="active-phone">Диалог</div>
                        <div class="chat-meta" id="active-meta">WhatsApp оператор панелі</div>
                    </div>
                </div>
                <div class="lock-pill" id="operator-lock" aria-live="polite"></div>
            </header>

            <main class="messages" id="messages">
                <div class="empty">
                    <div class="empty-box">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v6.4a2.8 2.8 0 0 1-2.8 2.8H13l-5 4v-4H6.8A2.8 2.8 0 0 1 4 13.2V6.8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
                        </div>
                        <h2 id="select-title">Диалогты таңдаңыз</h2>
                        <p id="select-text">Клиент хатын ашқанда толық тарих осы жерде көрінеді.</p>
                    </div>
                </div>
            </main>

            <footer class="composer">
                <div class="composer-box">

function normalizeAudioData(value, mediaType = 'audio/ogg') {
    let raw = String(value || '').trim();

    if (!raw) return '';

    raw = raw.replace(/\s+/g, '');

    if (raw.startsWith('data:')) {
        const commaIndex = raw.indexOf(',');
        if (commaIndex < 0) return '';

        const payload = raw.slice(commaIndex + 1);
        if (!payload) return '';

        return `data:${mediaType || 'audio/ogg'};base64,${payload}`;
    }

    if (raw.includes(',')) {
        raw = raw.slice(raw.lastIndexOf(',') + 1);
    }

    return `data:${mediaType || 'audio/ogg'};base64,${raw}`;
}

function buildAudioHtml(item) {
    if (!item) return '';

    const mediaKind = String(item.mediaKind || item.type || '').toLowerCase();
    const mediaType = String(item.mediaType || '')
        .split(';')[0]
        .replace(/[^\w/+.-]/g, '');

    const hasAudioPayload = Boolean(
        item.audioMessage ||
        item.data?.message?.audioMessage
    );

    const isAudio =
        mediaKind === 'audio' ||
        mediaKind === 'ptt' ||
        mediaType.startsWith('audio/') ||
        hasAudioPayload;

    if (!isAudio) return '';

    const inlineData = String(item.mediaData || '').trim();

    if (inlineData) {
        const src = normalizeAudioData(inlineData, mediaType);

        if (src) {
            return `
                <div class="audio-wrap">
                    <audio
                        class="audio-player"
                        controls
                        preload="metadata"
                        src="${escapeHtml(src)}">
                    </audio>
                </div>
            `;
        }
    }

    return `
        <div
            class="audio-wrap"
            data-audio-wrapper
            data-audio-id="${escapeHtml(String(item.id || ''))}">
            <audio class="audio-player" controls preload="none"></audio>
        </div>
    `;
}

async function hydrateAudioPlayers() {
    const wrappers = messagesEl.querySelectorAll(
        '[data-audio-wrapper][data-audio-id]:not([data-audio-loaded])'
    );

    for (const wrapper of wrappers) {
        const player = wrapper.querySelector('audio');
        const messageId = String(
            wrapper.getAttribute('data-audio-id') || ''
        ).trim();

        if (!player || !messageId) continue;

        if (player.getAttribute('src')) {
            wrapper.setAttribute('data-audio-loaded', '1');
            continue;
        }

        wrapper.setAttribute('data-audio-loaded', '1');

        try {
            const result = await fetchJson(
                `${endpoints.media}/${encodeURIComponent(instanceId)}/${encodeURIComponent(messageId)}`
            );

            const mediaType = String(result?.mediaType || 'audio/ogg')
                .split(';')[0]
                .replace(/[^\w/+.-]/g, '');

            const src = normalizeAudioData(result?.mediaData, mediaType);

            if (!src) {
                throw new Error('AUDIO_DATA_EMPTY');
            }

            player.pause();
            player.removeAttribute('src');
            player.src = src;
            player.load();
        } catch (error) {
            wrapper.removeAttribute('data-audio-loaded');
            setTimeout(hydrateAudioPlayers, 3000);
        }
    }
}

       async function fetchJson(url) {
    const response = await fetch(`${apiBase}${url}`, {
        credentials: 'same-origin',
        cache: 'no-store',
        headers: apiHeaders({
            Accept: 'application/json'
        })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.error || `HTTP_${response.status}`);
    }

    return data;
}

        async function postJson(url, body) {
            const response = await fetch(`${apiBase}${url}`, {
                method: 'POST',
                credentials: 'same-origin',
                cache: 'no-store',
                headers: apiHeaders({ 'content-type': 'application/json' }),
                body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        async function loadInbox(force = false) {
    if (isInboxLoading && !force) return;

    isInboxLoading = true;

    try {
        const result = await fetchJson(
            `${endpoints.inbox}/${encodeURIComponent(instanceId)}?limit=500`
        );

        const nextChats = Array.isArray(result?.items)
            ? result.items
            : Array.isArray(result?.chats)
                ? result.chats
                : [];

        const nextSignature = JSON.stringify(
            nextChats.map(chat => [
                chat.phone,
                chat.updatedAt,
                chat.lastAt,
                chat.unread,
                chat.closed,
                chat.lastText
            ])
        );

        chats = nextChats;

        if (nextSignature !== inboxSignature || force) {
            inboxSignature = nextSignature;
            renderList();
        }

        if (
            activePhone &&
            chats.some(chat => normalizePhone(chat.phone) === activePhone)
        ) {
            await loadHistory(false);
        }
    } finally {
        isInboxLoading = false;
    }
}

       async function loadHistory(force = false) {
    if (!activePhone || (isHistoryLoading && !force)) return;

    isHistoryLoading = true;

    try {
        const result = await fetchJson(
            `${endpoints.history}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`
        );

        const history = Array.isArray(result?.history)
            ? result.history
            : Array.isArray(result?.items)
                ? result.items
                : [];

        const nextSignature = JSON.stringify(
            history.map(item => [
                item.id,
                item.createdAt,
                item.timestamp,
                item.direction,
                item.fromMe,
                item.text,
                item.body,
                item.type,
                item.mediaData
            ])
        );

        if (force || nextSignature !== historySignature) {
            historySignature = nextSignature;
            renderHistory(history);
        }
    } finally {
        isHistoryLoading = false;
    }
}
        function syncViewedState() {
            if (!activePhone || Date.now() - lastViewSyncAt < 5000) return;
            lastViewSyncAt = Date.now();
            postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { action: 'view' }).catch(() => {});
        }

        function setOperatorLockTtl(ttl) {
            const seconds = Math.max(0, Math.ceil(Number(ttl) || 0));
            operatorLockUntil = seconds > 0 ? Date.now() + seconds * 1000 : 0;
            renderOperatorLock();
        }

        function renderOperatorLock() {
            if (!lockEl) return;
            const remaining = operatorLockUntil ? Math.max(0, Math.ceil((operatorLockUntil - Date.now()) / 1000)) : 0;
            lockEl.classList.toggle('show', Boolean(activePhone && remaining > 0));
            lockEl.textContent = remaining > 0 ? `Оператор: ${remaining}с` : '';
        }

        async function loadOperatorLock() {
            if (!activePhone || isLockLoading) {
                renderOperatorLock();
                return;
            }
            isLockLoading = true;
            const requestedPhone = activePhone;
            try {
                const data = await fetchJson(`${endpoints.lock}/${encodeURIComponent(instanceId)}/${encodeURIComponent(requestedPhone)}`);
                if (activePhone === data.phone) setOperatorLockTtl(data.ttl || 0);
            } catch (error) {
            } finally {
                isLockLoading = false;
            }
        }

        function openChat(phone) {
            activePhone = normalizePhone(phone);
            if (!activePhone) return;

            if (activeTab === 'new') {
                activeTab = 'all';
            }

            app.classList.add('chat-open');
            setActiveHeader(activePhone);
            inputEl.style.height = 'auto';
            isSending = false;
            
            const chat = chats.find(c => c.phone === activePhone);
            if (chat) {
                chat.unread = false;
                chat.viewed = true;
            }

            updateComposerState();
            historySignature = '';
            lastViewSyncAt = 0;
            messagesEl.innerHTML = `<div class="empty"><p>${escapeHtml(t('loading'))}</p></div>`;
            renderList();
            postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { action: 'view' })
                .then(loadInbox)
                .catch(() => {});
            loadHistory();
            loadOperatorLock();
            if (!isMobile()) inputEl.focus({ preventScroll: true });
        }

        function closeChat() { 
            app.classList.remove('chat-open'); 
            activePhone = ''; 
            operatorLockUntil = 0; 
            renderOperatorLock(); 
            setActiveHeader(''); 
            renderList(); 
        }

        async function runChatAction(action, phone) {
            const cleanPhone = normalizePhone(phone);
            if (!cleanPhone || isResolving) return;

            isResolving = true;
            updateComposerState();

            try {
                await postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(cleanPhone)}`, { action });
                
                if (action === 'close') showToast(t('resolveDone'));
                if (action === 'restore') showToast(t('restoreDone'));
                if (action === 'delete') showToast(t('deleteDone'));

                if (action === 'delete') {
                    chats = chats.filter(chat => normalizePhone(chat.phone) !== cleanPhone);
                } else {
                    const chat = chats.find(item => normalizePhone(item.phone) === cleanPhone);
                    if (chat) chat.closed = action === 'close' ? true : action === 'restore' ? false : chat.closed;
                }
                inboxSignature = '';

                if (activePhone === cleanPhone && (action === 'close' || action === 'delete')) {
                    activePhone = '';
                    app.classList.remove('chat-open');
                    setActiveHeader('');
                    messagesEl.innerHTML = '';
                }
                renderList();
            } catch (err) {
                showToast(t('resolveFailed'));
            } finally {
                isResolving = false;
                loadInbox();
            }
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !activePhone || isSending) return;

            pendingText = text;
            isSending = true;
            messagesEl.insertAdjacentHTML('beforeend', `<div class="row operator"><div class="bubble"><span class="bubble-label">Operator</span>${escapeHtml(text)}</div></div>`);
            scrollToBottomSafe(messagesEl);
            inputEl.value = '';
            inputEl.style.height = 'auto';
            updateComposerState();

            try {
                await postJson(`${endpoints.send}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { text });
                isSending = false;
                pendingText = '';
                updateComposerState();
                
                const chat = chats.find(c => c.phone === activePhone);
                if (chat) {
                    chat.hasOperator = true;
                    chat.unread = false;
                }
                
                setOperatorLockTtl(60);
                activeTab = 'operator';

                loadInbox();
                loadHistory();
                loadOperatorLock();
            } catch (error) {
                isSending = false;
                if (pendingText && !inputEl.value.trim()) inputEl.value = pendingText;
                pendingText = '';
                showToast(t('sendFailed'));
                updateComposerState();
            }
        }

        document.querySelector('.tabs').addEventListener('click', event => {
            const button = event.target.closest('.tab');
            if (!button) return;
            activeTab = button.dataset.tab;
            
            if (activePhone) {
                const chat = chats.find(c => c.phone === activePhone);
                const isArchived = isChatArchived(chat);
                if ((activeTab === 'archive' && !isArchived) || (activeTab !== 'archive' && isArchived)) {
                    activePhone = '';
                    closeChat();
                    setActiveHeader('');
                    messagesEl.innerHTML = '';
                }
            }
            renderList();
        });

        listEl.addEventListener('click', event => {
            const switchButton = event.target.closest('[data-switch-tab]');
            if (switchButton) {
                activeTab = switchButton.dataset.switchTab;
                renderList();
                return;
            }

            const actionButton = event.target.closest('[data-chat-action]');
            if (actionButton) {
                runChatAction(actionButton.dataset.chatAction, actionButton.dataset.phone);
                return;
            }

            const item = event.target.closest('.chat-item');
            if (item) openChat(item.dataset.phone);
        });

        searchInput.addEventListener('input', () => renderList());
        searchInput.addEventListener('keydown', event => {
            if (event.key !== 'Enter') return;
            if (!searchPhoneCandidate()) return;
            event.preventDefault();
            openDirectChatFromSearch();
        });

        directChatBtn.addEventListener('click', openDirectChatFromSearch);
        refreshBtn.addEventListener('click', () => {
            inboxSignature = '';
            historySignature = '';
            loadInbox();
            loadHistory();
        });
        
        backBtn.addEventListener('click', closeChat);
        sendBtn.addEventListener('click', sendMessage);

        for (const button of langToggles) button.addEventListener('click', () => {
            lang = lang === 'kk' ? 'ru' : 'kk';
            localStorage.setItem('operator_chat_lang', lang);
            applyLanguage();
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = `${Math.min(inputEl.scrollHeight, 132)}px`;
            updateComposerState();
        });

        inputEl.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        applyLanguage();
        updateComposerState();
        loadInbox();
        
        setInterval(() => {
    loadInbox();

    if (activePhone) {
        loadHistory();
        loadOperatorLock();
    }
}, 3000);

        setInterval(renderOperatorLock, 1000);

    </script>
</body>
</html>
