<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WhatsPro Inbox</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef3f8;
      --line: #d9e2ec;
      --line-strong: #c3ced9;
      --text: #17212f;
      --muted: #64748b;
      --accent: #0f9f7a;
      --accent-2: #2563eb;
      --danger: #d92d20;
      --shadow: 0 18px 45px rgba(15, 23, 42, .08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
    }

    .sidebar {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { min-width: 0; }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 750;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .icon-button:hover { border-color: var(--line-strong); background: var(--surface-2); }

    .search {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .search input:focus { border-color: var(--accent-2); background: var(--surface); }

    .conversation-list {
      min-height: 0;
      overflow: auto;
      padding: 8px;
    }

    .conversation {
      width: 100%;
      min-height: 64px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 10px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
    }

    .conversation:hover,
    .conversation.active { background: var(--surface-2); }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #d7f5ed;
      color: #067052;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .conversation-main { min-width: 0; }
    .conversation-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .phone {
      font-size: 14px;
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .preview {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-header {
      min-height: 73px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .86);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .chat-title { min-width: 0; }
    .chat-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty, .error {
      margin: auto;
      max-width: 360px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    .error { color: var(--danger); }

    .message {
      max-width: min(680px, 78%);
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 18px rgba(15, 23, 42, .06);
      align-self: flex-start;
    }

    .message.outgoing {
      align-self: flex-end;
      background: #dcf7ef;
    }

    .message-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.42;
      font-size: 14px;
    }

    .message-time {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .composer textarea {
      width: 100%;
      min-height: 42px;
      max-height: 140px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      outline: none;
      color: var(--text);
      background: var(--surface-2);
      line-height: 1.35;
    }

    .composer textarea:focus {
      border-color: var(--accent-2);
      background: var(--surface);
    }

    .send-button {
      min-width: 88px;
      height: 42px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-weight: 750;
      padding: 0 16px;
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <header class="header">
        <div class="brand">
          <h1>Inbox</h1>
          <p id="instanceLabel">Instance</p>
        </div>
        <button class="icon-button" id="refreshButton" type="button" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M3 21v-5h5"></path>
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
          </svg>
        </button>
      </header>
      <div class="search">
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search phone">
      </div>
      <section class="conversation-list" id="conversationList" aria-label="Conversations"></section>
    </aside>

    <section class="main">
      <header class="chat-header">
        <div class="chat-title">
          <h2 id="chatTitle">Select a chat</h2>
          <p id="chatMeta">No conversation selected</p>
        </div>
        <div class="status" id="statusText">Idle</div>
      </header>
      <section class="messages" id="messages" aria-live="polite">
        <div class="empty">No chat selected.</div>
      </section>
      <form class="composer" id="composer">
        <textarea id="messageInput" autocomplete="off" placeholder="Reply as operator" rows="1"></textarea>
        <button class="send-button" id="sendButton" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <!--__CHAT_CONFIG__-->
  <script>
    const CHAT_CONFIG = window.__CHAT_CONFIG__ || {};
    const params = new URLSearchParams(window.location.search);
    const instanceId = String(CHAT_CONFIG.instance || params.get('instance') || '').trim();
    const apiBase = String(CHAT_CONFIG.apiBase || window.location.origin).replace(/\/+$/, '');
    const endpoints = CHAT_CONFIG.endpoints || {};
    const state = { inbox: [], history: [], selectedPhone: '', loading: false };

    const nodes = {
      instanceLabel: document.getElementById('instanceLabel'),
      refreshButton: document.getElementById('refreshButton'),
      searchInput: document.getElementById('searchInput'),
      conversationList: document.getElementById('conversationList'),
      chatTitle: document.getElementById('chatTitle'),
      chatMeta: document.getElementById('chatMeta'),
      statusText: document.getElementById('statusText'),
      messages: document.getElementById('messages'),
      composer: document.getElementById('composer'),
      messageInput: document.getElementById('messageInput'),
      sendButton: document.getElementById('sendButton')
    };

    function applyTenantTheme() {
      const branding = CHAT_CONFIG.branding || {};
      if (branding.accentColor) document.documentElement.style.setProperty('--accent', branding.accentColor);
      if (branding.secondaryColor) document.documentElement.style.setProperty('--accent-2', branding.secondaryColor);
      if (branding.backgroundColor) document.documentElement.style.setProperty('--bg', branding.backgroundColor);
      const title = String(branding.name || 'Inbox').trim();
      document.title = title ? `${title} Inbox` : 'WhatsPro Inbox';
      const h1 = document.querySelector('.brand h1');
      if (h1) h1.textContent = title || 'Inbox';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function formatPhone(phone) {
      const raw = String(phone || '');
      if (raw.length !== 11) return raw || '-';
      return `+${raw.slice(0, 1)} ${raw.slice(1, 4)} ${raw.slice(4, 7)} ${raw.slice(7, 9)} ${raw.slice(9)}`;
    }

    function formatTime(value) {
      const date = new Date(Number(value) || Date.now());
      return new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' }).format(date);
    }

    function setStatus(text) {
      nodes.statusText.textContent = text;
    }

    function apiUrl(path) {
      return `${apiBase}${String(path || '').startsWith('/') ? path : `/${path}`}`;
    }

    async function fetchJson(url) {
      const response = await fetch(apiUrl(url), { credentials: 'same-origin' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    async function postJson(url, body) {
      const response = await fetch(apiUrl(url), {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    function getLastMessage(phone) {
      if (phone !== state.selectedPhone || !state.history.length) return '';
      const last = state.history[state.history.length - 1];
      return last.text || last.body || '';
    }

    function renderInbox() {
      const query = nodes.searchInput.value.trim().toLowerCase();
      const items = state.inbox.filter(item => !query || String(item.phone).includes(query));

      if (!instanceId) {
        nodes.conversationList.innerHTML = '<div class="empty">Missing instance.</div>';
        return;
      }

      if (!items.length) {
        nodes.conversationList.innerHTML = '<div class="empty">No conversations.</div>';
        return;
      }

      nodes.conversationList.innerHTML = items.map(item => {
        const active = item.phone === state.selectedPhone ? ' active' : '';
        const preview = getLastMessage(item.phone) || 'Open conversation';
        return `
          <button class="conversation${active}" type="button" data-phone="${escapeHtml(item.phone)}">
            <div class="avatar">${escapeHtml(String(item.phone).slice(-2) || '?')}</div>
            <div class="conversation-main">
              <div class="conversation-top">
                <div class="phone">${escapeHtml(formatPhone(item.phone))}</div>
                <div class="time">${escapeHtml(formatTime(item.updatedAt))}</div>
              </div>
              <div class="preview">${escapeHtml(preview)}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function renderHistory() {
      if (!state.selectedPhone) {
        nodes.chatTitle.textContent = 'Select a chat';
        nodes.chatMeta.textContent = 'No conversation selected';
        nodes.messages.innerHTML = '<div class="empty">No chat selected.</div>';
        nodes.sendButton.disabled = true;
        return;
      }

      nodes.chatTitle.textContent = formatPhone(state.selectedPhone);
      nodes.chatMeta.textContent = `${state.history.length} messages`;
      nodes.sendButton.disabled = !nodes.messageInput.value.trim();

      if (!state.history.length) {
        nodes.messages.innerHTML = '<div class="empty">No messages.</div>';
        return;
      }

      nodes.messages.innerHTML = state.history.map(message => {
        const role = String(message.role || '').toLowerCase();
        const outgoing = message.direction === 'outgoing' || message.fromMe === true || ['assistant', 'model', 'operator'].includes(role);
        const text = message.text || message.body || '[media]';
        return `
          <article class="message${outgoing ? ' outgoing' : ''}">
            <div class="message-text">${escapeHtml(text)}</div>
            <div class="message-time">${escapeHtml(formatTime(message.createdAt))}</div>
          </article>
        `;
      }).join('');
      nodes.messages.scrollTop = nodes.messages.scrollHeight;
    }

    async function loadInbox() {
      if (!instanceId) {
        nodes.instanceLabel.textContent = 'Missing instance query';
        renderInbox();
        return;
      }

      setStatus('Loading');
      const data = await fetchJson(`${endpoints.inbox}/${encodeURIComponent(instanceId)}`);
      state.inbox = Array.isArray(data.items) ? data.items : [];
      renderInbox();
      setStatus('Live');
    }

    async function loadHistory(phone) {
      state.selectedPhone = phone;
      setStatus('Loading');
      const data = await fetchJson(`${endpoints.history}/${encodeURIComponent(instanceId)}/${encodeURIComponent(phone)}`);
      state.history = Array.isArray(data.history) ? data.history : [];
      renderInbox();
      renderHistory();
      setStatus('Live');
    }

    applyTenantTheme();
    nodes.instanceLabel.textContent = (CHAT_CONFIG.branding && CHAT_CONFIG.branding.subtitle) || instanceId || 'Missing instance';
    nodes.refreshButton.addEventListener('click', () => {
      loadInbox().catch(error => {
        setStatus('Error');
        nodes.conversationList.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      });
      if (state.selectedPhone) {
        loadHistory(state.selectedPhone).catch(error => {
          setStatus('Error');
          nodes.messages.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        });
      }
    });

    nodes.searchInput.addEventListener('input', renderInbox);
    nodes.messageInput.addEventListener('input', () => {
      nodes.sendButton.disabled = !state.selectedPhone || !nodes.messageInput.value.trim();
    });
    nodes.composer.addEventListener('submit', event => {
      event.preventDefault();
      const text = nodes.messageInput.value.trim();
      if (!instanceId || !state.selectedPhone || !text) return;
      nodes.sendButton.disabled = true;
      setStatus('Sending');
      postJson(`${endpoints.send}/${encodeURIComponent(instanceId)}/${encodeURIComponent(state.selectedPhone)}`, { text })
        .then(() => {
          nodes.messageInput.value = '';
          return loadHistory(state.selectedPhone);
        })
        .then(() => setStatus('Live'))
        .catch(error => {
          setStatus('Error');
          nodes.messages.insertAdjacentHTML('beforeend', `<div class="error">${escapeHtml(error.message)}</div>`);
        })
        .finally(() => {
          nodes.sendButton.disabled = !state.selectedPhone || !nodes.messageInput.value.trim();
        });
    });
    nodes.conversationList.addEventListener('click', event => {
      const button = event.target.closest('[data-phone]');
      if (!button) return;
      loadHistory(button.dataset.phone).catch(error => {
        setStatus('Error');
        nodes.messages.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      });
    });

    loadInbox().catch(error => {
      setStatus('Error');
      nodes.conversationList.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    });
    setInterval(() => {
      loadInbox().catch(() => {});
      if (state.selectedPhone) loadHistory(state.selectedPhone).catch(() => {});
    }, 10000);
  </script>
</body>
</html>
