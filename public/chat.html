<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Оператор чаты</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#0f141e',
                        sidebarBg: '#0b111d',
                        headBg: '#18212f',
                        userBubble: '#1b2436',
                        operatorBubble: '#168379',
                        inputBg: '#0f141e',
                        inputBorder: '#168379',
                        btnBg: '#2c3e56',
                        operatorLabel: '#7dd3fc',
                        line: '#27374e',
                        muted: '#8ca0ba',
                    }
                }
            }
        }
    </script>
    <style>
        audio {
            filter: invert(90%) hue-rotate(180deg) brightness(1.2);
            height: 40px;
            outline: none;
            width: 100%;
        }
        audio::-webkit-media-controls-panel {
            background-color: #f1f3f4;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2c3e56; border-radius: 4px; }
        
        .chat-open .sidebar-container { transform: translateX(-100%); }
        .chat-open .chat-container { transform: translateX(0); }
        
        @media (max-width: 840px) {
            .sidebar-container, .chat-container {
                position: absolute;
                inset: 0;
                width: 100%;
                transition: transform 0.24s ease;
            }
            .chat-container { transform: translateX(100%); }
            .back-btn { display: flex; }
        }
        @media (min-width: 841px) {
            .back-btn { display: none; }
            .chat-container { transform: none !important; }
            .sidebar-container { transform: none !important; }
        }
    </style>
</head>
<body class="bg-appBg text-white h-screen overflow-hidden font-sans flex flex-col md:flex-row relative" id="app">

    <!-- Sidebar -->
    <aside class="sidebar-container bg-sidebarBg w-full md:w-[390px] h-full flex flex-col border-r border-line z-10 shrink-0">
        <header class="bg-headBg/95 backdrop-blur-md min-h-[68px] flex items-center justify-between px-4 py-3 border-b border-line">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-md bg-teal-700 text-white flex items-center justify-center shadow-[0_12px_30px_rgba(16,185,129,0.2)]">
                    <i class="fa-solid fa-headset"></i>
                </div>
                <div>
                    <p class="text-muted text-[10px] font-bold uppercase flex items-center gap-1.5 mb-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_0_4px_rgba(16,185,129,0.12)]"></span>
                        <span id="operator-label">Оператор чаты</span>
                    </p>
                    <h1 class="text-base font-extrabold truncate" id="instance-title">Кабинет</h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="w-10 h-10 rounded-md border border-line bg-[#0f1b2d] hover:bg-[#1d2b3f] text-xs font-black uppercase transition-colors" id="lang-toggle" data-lang-toggle title="Тілді ауыстыру">KZ</button>
                <button class="w-10 h-10 rounded-md border border-line bg-btnBg hover:bg-[#3b4b61] text-gray-300 hover:text-white transition-colors flex items-center justify-center" id="refresh-btn" title="Жаңарту">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </header>

        <section class="p-4 border-b border-line bg-[#111c2d]">
            <div class="grid grid-cols-4 gap-1 p-1 border border-[#1f3048] rounded-md bg-[#0b1422]" role="tablist">
                <button class="tab active bg-[#31445d] text-white shadow-[inset_0_0_0_1px_rgba(255,255,255,0.04)] h-9 rounded text-xs font-bold truncate transition-colors" id="tab-new" data-tab="new">Жаңа</button>
                <button class="tab text-muted hover:bg-[#1a2638] h-9 rounded text-xs font-bold truncate transition-colors" id="tab-all" data-tab="all">Бәрі</button>
                <button class="tab text-muted hover:bg-[#1a2638] h-9 rounded text-xs font-bold truncate transition-colors" id="tab-operator" data-tab="operator">Опер</button>
                <button class="tab text-muted hover:bg-[#1a2638] h-9 rounded text-xs font-bold truncate transition-colors" id="tab-archive" data-tab="archive">Архив</button>
            </div>
            <div class="relative mt-4">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input id="search-input" autocomplete="off" placeholder="Нөмір немесе мәтін бойынша іздеу" class="w-full h-11 pl-10 pr-3 border border-[#2b3d55] rounded-md bg-[#142034] text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
            </div>
            <button class="w-full min-h-[38px] mt-2 px-3 border border-[#2b3d55] rounded-md bg-[#19304c] hover:bg-[#244766] text-blue-100 text-sm font-bold text-left transition-colors" id="direct-chat-btn" hidden></button>
        </section>

        <main class="flex-1 overflow-y-auto p-2" id="contact-list"></main>
    </aside>

    <!-- Chat Area -->
    <section class="chat-container bg-appBg flex-1 flex flex-col h-full z-20">
        <header class="bg-headBg min-h-[68px] flex items-center justify-between px-4 py-3 border-b border-line shrink-0">
            <div class="flex items-center gap-3">
                <button class="back-btn w-10 h-10 rounded-md border border-line bg-btnBg hover:bg-[#3b4b61] text-gray-300 flex items-center justify-center transition-colors" id="back-btn" title="Артқа">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="w-10 h-10 rounded-md bg-btnBg flex items-center justify-center text-gray-200 shadow-sm" id="active-avatar">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="truncate">
                    <div class="font-bold text-[17px] tracking-wide truncate" id="active-phone">Диалог</div>
                    <div class="text-xs text-muted truncate" id="active-meta">WhatsApp оператор панелі</div>
                </div>
            </div>
            <div class="hidden items-center gap-1.5 px-3 py-1.5 border border-teal-500/30 rounded-full bg-teal-800/20 text-teal-300 text-xs font-bold" id="operator-lock"></div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4" id="messages">
            <div class="h-full flex items-center justify-center text-center text-muted">
                <div class="grid place-items-center gap-3 max-w-sm">
                    <div class="w-12 h-12 rounded-full bg-[#172338] text-[#8aa3bf] flex items-center justify-center text-xl">
                        <i class="fa-regular fa-comments"></i>
                    </div>
                    <h2 class="text-lg font-bold text-white" id="select-title">Диалогты таңдаңыз</h2>
                    <p class="text-sm" id="select-text">Клиент хатын ашқанда толық тарих осы жерде көрінеді.</p>
                </div>
            </div>
        </main>

        <footer class="p-4 bg-appBg border-t border-line flex items-end gap-3 shrink-0">
            <textarea id="message-input" rows="1" disabled placeholder="Клиентке WhatsApp арқылы жауап..." class="flex-1 min-h-[46px] max-h-[132px] bg-inputBg text-gray-200 border border-inputBorder rounded-md py-3 px-4 focus:outline-none focus:ring-2 focus:ring-teal-500/20 placeholder-gray-500/80 resize-none transition-all disabled:opacity-50"></textarea>
            <button class="bg-operatorBubble hover:bg-teal-600 disabled:bg-[#2a3c55] disabled:text-[#7d91aa] disabled:cursor-not-allowed transition-colors w-[46px] h-[46px] rounded-md flex items-center justify-center shrink-0 shadow-[0_14px_30px_rgba(16,185,129,0.2)] disabled:shadow-none" id="send-btn" disabled title="Жіберу">
                <i class="fa-regular fa-paper-plane text-white text-lg"></i>
            </button>
        </footer>
    </section>

    <!-- Toast Notification -->
    <div class="fixed left-1/2 bottom-6 -translate-x-1/2 translate-y-24 z-50 max-w-[calc(100vw-32px)] px-4 py-2 border border-line rounded-md bg-[#111c2d] text-white shadow-[0_20px_60px_rgba(0,0,0,0.28)] opacity-0 transition-all duration-200 flex items-center gap-2" id="toast" role="status"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const chatConfig = window.__CHAT_CONFIG__ || {};
        const instanceId = (params.get('instance') || chatConfig.instance || 'prestige').trim();
        function sameOriginApiBase(value) {
            try {
                const raw = String(value || '').replace(/\/+$/, '');
                return raw && new URL(raw, window.location.href).origin === window.location.origin ? raw : '';
            } catch (e) {
                return '';
            }
        }

        const apiBase = sameOriginApiBase(chatConfig.apiBase);
        const chatToken = String(chatConfig.chatToken || '');

        function scrollToBottomSafe(messagesEl) {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function apiHeaders(extra = {}) {
            return {
                ...(chatToken ? { 'x-chat-token': chatToken, 'x-chat-instance': instanceId } : {}),
                ...extra
            };
        }
        
        const endpoints = {
            inbox: '/api/chat/inbox',
            history: '/api/chat/history',
            send: '/api/chat/send',
            media: '/api/chat/media',
            lock: '/api/chat/operator-lock',
            action: '/api/chat/action',
            ...(chatConfig.endpoints || {})
        };

        const app = document.getElementById('app');
        const listEl = document.getElementById('contact-list');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const searchInput = document.getElementById('search-input');
        const directChatBtn = document.getElementById('direct-chat-btn');
        const toast = document.getElementById('toast');
        const langToggles = Array.from(document.querySelectorAll('[data-lang-toggle]'));
        const refreshBtn = document.getElementById('refresh-btn');
        const backBtn = document.getElementById('back-btn');
        const lockEl = document.getElementById('operator-lock');

        const copy = {
            kk: {
                title: 'Оператор чаты',
                operatorLabel: 'Оператор чаты',
                instanceTitle: value => `${value.toUpperCase()} операторлары`,
                langTitle: 'Тілді ауыстыру',
                refresh: 'Жаңарту',
                back: 'Артқа',
                tabs: { new: 'Жаңа', all: 'Бәрі', operator: 'Опер', archive: 'Архив' },
                tabList: 'Диалог сүзгісі',
                search: 'Нөмір немесе мәтін бойынша іздеу',
                dialog: 'Диалог',
                defaultMeta: 'WhatsApp оператор панелі',
                selectedMeta: 'WhatsApp арқылы жауап беріледі',
                selectTitle: 'Диалогты таңдаңыз',
                selectText: 'Клиент хатын ашқанда толық тарих осы жерде көрінеді.',
                emptySearch: 'Нәтиже табылған жоқ',
                emptyNew: 'Жаңа хат жоқ',
                emptyArchive: 'Архив бос',
                openAll: 'Барлық диалогтарды ашу',
                noHistory: 'Тарих бос',
                loading: 'Тарих оқылуда...',
                noMessage: 'Хабар жоқ',
                newBadge: 'жаңа',
                operatorBadge: 'оператор',
                botLabel: 'AI Bot',
                systemDefault: 'Оператор қосылды',
                placeholder: 'Клиентке WhatsApp арқылы жауап...',
                resolve: 'Жаздым',
                restore: 'Қайтару',
                resolveTitle: 'Чатты аяқталды деп белгілеу',
                restoreTitle: 'Чатты архивтен қайтару',
                deleteTitle: 'Диалогты толық өшіру',
                resolveDone: 'Чат аяқталды деп белгіленді',
                restoreDone: 'Чат архивтен қайтарылды',
                deleteDone: 'Диалог өшірілді',
                resolveFailed: 'Чатты белгілеу мүмкін болмады',
                archiveBadge: 'архив',
                archiveMeta: 'Архивтегі диалог',
                archivedPlaceholder: 'Алдымен чатты архивтен қайтарыңыз',
                sendFailed: 'Хабар жіберілмеді',
                directOpen: phone => `+${phone} нөміріне жазу`,
                manualChat: 'Оператор ашқан диалог'
            },
            ru: {
                title: 'Чат оператора',
                operatorLabel: 'Чат оператора',
                instanceTitle: value => `Операторы ${value.toUpperCase()}`,
                langTitle: 'Сменить язык',
                refresh: 'Обновить',
                back: 'Назад',
                tabs: { new: 'Новые', all: 'Все', operator: 'Опер', archive: 'Архив' },
                tabList: 'Фильтр диалогов',
                search: 'Поиск по номеру или тексту',
                dialog: 'Диалог',
                defaultMeta: 'Панель WhatsApp оператора',
                selectedMeta: 'Ответ будет отправлен через WhatsApp',
                selectTitle: 'Выберите диалог',
                selectText: 'Когда вы откроете клиента, здесь появится полная история.',
                emptySearch: 'Ничего не найдено',
                emptyNew: 'Новых сообщений нет',
                emptyArchive: 'Архив пуст',
                openAll: 'Открыть все диалоги',
                noHistory: 'История пуста',
                loading: 'История загружается...',
                noMessage: 'Сообщений нет',
                newBadge: 'новое',
                operatorBadge: 'оператор',
                botLabel: 'AI Bot',
                systemDefault: 'Оператор подключился',
                placeholder: 'Ответ клиенту через WhatsApp...',
                resolve: 'Готово',
                restore: 'Вернуть',
                resolveTitle: 'Отметить чат завершенным',
                restoreTitle: 'Вернуть чат из архива',
                deleteTitle: 'Полностью удалить диалог',
                resolveDone: 'Чат отмечен завершенным',
                restoreDone: 'Чат возвращен из архива',
                deleteDone: 'Диалог удален',
                resolveFailed: 'Не удалось отметить чат',
                archiveBadge: 'архив',
                archiveMeta: 'Диалог в архиве',
                archivedPlaceholder: 'Сначала верните чат из архива',
                sendFailed: 'Сообщение не отправлено',
                directOpen: phone => `Написать на +${phone}`,
                manualChat: 'Диалог открыт оператором'
            }
        };

        let lang = localStorage.getItem('operator_chat_lang') === 'ru' ? 'ru' : 'kk';
        let chats = [];
        let activeTab = 'new';
        let activePhone = '';
        let toastTimer = null;
        let isSending = false;
        let isResolving = false;
        let pendingText = '';
        let inboxSignature = '';
        let historySignature = '';
        let isInboxLoading = false;
        let isHistoryLoading = false;
        let operatorLockUntil = 0;
        let isLockLoading = false;
        let lastViewSyncAt = 0;

        function t(key) { return copy[lang][key] || copy.kk[key] || key; }
        function isMobile() { return window.matchMedia('(max-width: 840px)').matches; }

        function showToast(text) {
            clearTimeout(toastTimer);
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-blue-400"></i> ${escapeHtml(text)}`;
            toast.classList.remove('translate-y-24', 'opacity-0');
            toastTimer = setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 2400);
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[char]));
        }

        function cleanText(value) {
            return String(value || '')
                .replace(/\[System:[^\]]*\]/gi, '')
                .replace(/\[Оператор:\s*/gi, '')
                .replace(/\[ESCALATE_ADMIN\]/gi, '')
                .replace(/\[menu_link_sent\]/gi, '')
                .replace(/\]$/g, '')
                .trim();
        }

        function formatTime(value) {
            const time = Number(value || 0);
            if (!time || time < 100000000000) return '';
            const date = new Date(time);
            try {
                return date.toLocaleTimeString(lang === 'ru' ? 'ru-RU' : 'kk-KZ', { hour: '2-digit', minute: '2-digit' });
            } catch (error) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }

        function normalizePhone(value) { return String(value || '').replace(/\D/g, ''); }
        function searchPhoneCandidate() {
            const digits = normalizePhone(searchInput.value);
            return digits.length >= 10 ? digits : '';
        }

        function updateDirectChatButton() {
            const phone = searchPhoneCandidate();
            const alreadyListed = phone && chats.some(chat => normalizePhone(chat.phone) === phone);
            const shouldShow = Boolean(phone && !alreadyListed);
            directChatBtn.hidden = !shouldShow;
            if (shouldShow) directChatBtn.textContent = copy[lang].directOpen(phone);
        }

        function openDirectChatFromSearch() {
            const phone = searchPhoneCandidate();
            if (!phone) return;
            const existing = chats.find(chat => normalizePhone(chat.phone) === phone);
            if (!existing) {
                chats = [{ phone, lastAt: Date.now(), lastText: t('manualChat'), unread: false, viewed: true, hasOperator: false, closed: false }, ...chats];
            }
            activeTab = 'all';
            searchInput.value = '';
            renderList();
            openChat(phone);
        }

        function isChatArchived(chat) { return Boolean(chat && chat.closed); }

        function counts() {
            const active = chats.filter(chat => !isChatArchived(chat));
            const archived = chats.filter(isChatArchived);
            return {
                new: active.filter(chat => chat.unread).length,
                all: active.filter(chat => chat.viewed && !chat.hasOperator).length,
                operator: active.filter(chat => chat.hasOperator).length,
                archive: archived.length
            };
        }

        function filteredChats() {
            const query = searchInput.value.trim().toLowerCase();
            return chats.filter(chat => {
                const archived = isChatArchived(chat);
                if (activeTab === 'archive' && !archived) return false;
                if (activeTab !== 'archive' && archived) return false;
                const isActiveChat = normalizePhone(chat.phone) === activePhone;
                if (isActiveChat && !query) return true;
                if (activeTab === 'new' && !chat.unread) return false;
                if (activeTab === 'all' && (!chat.viewed || chat.hasOperator)) return false;
                if (activeTab === 'operator' && !chat.hasOperator) return false;
                if (!query) return true;
                return String(chat.phone).includes(query)
                    || String(chat.displayName || '').toLowerCase().includes(query)
                    || String(chat.lastText || '').toLowerCase().includes(query);
            });
        }

        function renderTabs() {
            const total = counts();
            for (const tab of document.querySelectorAll('.tab')) {
                const key = tab.dataset.tab;
                if(key === activeTab) {
                    tab.classList.add('bg-[#31445d]', 'text-white', 'shadow-[inset_0_0_0_1px_rgba(255,255,255,0.04)]');
                    tab.classList.remove('text-muted', 'hover:bg-[#1a2638]');
                } else {
                    tab.classList.remove('bg-[#31445d]', 'text-white', 'shadow-[inset_0_0_0_1px_rgba(255,255,255,0.04)]');
                    tab.classList.add('text-muted', 'hover:bg-[#1a2638]');
                }
                tab.textContent = `${copy[lang].tabs[key]} ${total[key] ? total[key] : ''}`.trim();
            }
        }

        function emptyListMarkup() {
            const total = counts();
            const canOpenAll = !searchInput.value.trim() && activeTab === 'new' && total.all > 0;
            const text = activeTab === 'archive' ? t('emptyArchive') : (canOpenAll ? t('emptyNew') : t('emptySearch'));
            const action = canOpenAll
                ? `<button class="w-full mt-3 h-9 bg-[#19304c] hover:bg-[#244766] text-blue-100 rounded text-sm font-bold transition-colors" type="button" data-switch-tab="all">${escapeHtml(t('openAll'))}</button>`
                : '';

            return `
                <div class="h-full flex flex-col items-center justify-center text-center text-muted p-4">
                    <i class="fa-solid fa-inbox text-3xl mb-3 text-[#8aa3bf] opacity-50"></i>
                    <p class="text-sm">${escapeHtml(text)}</p>
                    ${action}
                </div>`;
        }

        function renderList() {
            const previousTop = listEl.scrollTop;
            renderTabs();
            updateDirectChatButton();
            const items = filteredChats();

            if (!items.length) {
                listEl.innerHTML = emptyListMarkup();
                listEl.scrollTop = previousTop;
                return;
            }

            listEl.innerHTML = items.map(chat => {
                const phone = normalizePhone(chat.phone);
                const isActive = activePhone === phone;
                const isUnread = chat.unread;
                const archived = isChatArchived(chat);
                const actionDisabled = isResolving ? 'disabled' : '';
                const displayName = String(chat.displayName || '').trim();
                const title = displayName || `+${phone}`;
                
                let activeClass = isActive ? 'border-[#365274] bg-[#1a2a42]' : 'border-transparent hover:bg-[#152238]';
                let avatarClass = isUnread ? 'bg-cyan-700 shadow-[0_0_0_4px_rgba(14,116,144,0.18)]' : 'bg-[#263a54]';
                let previewClass = isUnread ? 'text-sky-300 font-bold' : 'text-[#9aacbf]';

                const badges = [
                    archived ? `<span class="px-2 py-0.5 rounded-full bg-slate-400/10 text-slate-300 text-[10px] font-bold">${escapeHtml(t('archiveBadge'))}</span>` : '',
                    chat.unread ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 text-[10px] font-bold">${escapeHtml(t('newBadge'))}</span>` : '',
                    chat.hasOperator ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 text-[10px] font-bold">${escapeHtml(t('operatorBadge'))}</span>` : ''
                ].join('');

                const actions = archived
                    ? `
                        <div class="flex items-center gap-1.5 ml-2 shrink-0">
                            <button class="w-8 h-8 rounded bg-emerald-500/10 text-emerald-200 border border-emerald-500/20 hover:bg-emerald-500/20 hover:text-white flex items-center justify-center transition-colors disabled:opacity-50" type="button" data-chat-action="restore" data-phone="${escapeHtml(phone)}" ${actionDisabled} title="${escapeHtml(t('restoreTitle'))}"><i class="fa-solid fa-check"></i></button>
                            <button class="w-8 h-8 rounded bg-red-500/10 text-red-200 border border-red-500/20 hover:bg-red-500/20 hover:text-white flex items-center justify-center transition-colors disabled:opacity-50" type="button" data-chat-action="delete" data-phone="${escapeHtml(phone)}" ${actionDisabled} title="${escapeHtml(t('deleteTitle'))}"><i class="fa-solid fa-xmark"></i></button>
                        </div>`
                    : `
                        <div class="flex items-center gap-1.5 ml-2 shrink-0">
                            <button class="w-8 h-8 rounded bg-emerald-500/10 text-emerald-200 border border-emerald-500/20 hover:bg-emerald-500/20 hover:text-white flex items-center justify-center transition-colors disabled:opacity-50" type="button" data-chat-action="close" data-phone="${escapeHtml(phone)}" ${actionDisabled} title="${escapeHtml(t('resolveTitle'))}"><i class="fa-solid fa-check"></i></button>
                        </div>`;

                return `
                    <article class="flex items-center p-3 mb-1.5 border rounded-lg cursor-pointer text-left transition-colors ${activeClass}" role="button" tabindex="0" data-phone="${escapeHtml(phone)}">
                        <div class="w-11 h-11 rounded-md flex items-center justify-center text-white shrink-0 ${avatarClass} transition-all"><i class="fa-regular fa-user"></i></div>
                        <div class="flex-1 min-w-0 ml-3">
                            <div class="flex justify-between items-center mb-0.5">
                                <div class="font-extrabold text-[15px] truncate">${escapeHtml(title)}</div>
                                <div class="text-xs text-[#7890ab] font-bold shrink-0 ml-2">${escapeHtml(formatTime(chat.lastAt))}</div>
                            </div>
                            ${displayName ? `<div class="text-[11px] font-bold text-muted truncate mt-0.5">+${escapeHtml(phone)}</div>` : ''}
                            <div class="text-[13px] truncate mt-1 ${previewClass}">${escapeHtml(chat.lastText || t('noMessage'))}</div>
                            <div class="flex flex-wrap gap-1.5 mt-2">${badges}</div>
                        </div>
                        ${actions}
                    </article>`;
            }).join('');
            listEl.scrollTop = previousTop;
        }

        function buildAudioHtml(item) {
            if (!item) return '';
            const type = String(item.type || item.mediaKind || '').toLowerCase();
            if (type !== 'audio' && type !== 'ptt') return ''; 

            const rawData = String(item.mediaData || '').trim();
            const mediaType = String(item.mediaType || 'audio/ogg').replace(/[^\w/+.-]/g, '') || 'audio/ogg';

            if (rawData) {
                const src = rawData.startsWith('data:') ? rawData : `data:${mediaType};base64,${rawData.replace(/\s+/g, '')}`;
                return `<div class="w-full mt-2"><audio controls preload="metadata" src="${escapeHtml(src)}"></audio></div>`;
            }

            if (item.id) {
                return `<div class="w-full mt-2" data-audio-wrapper data-audio-id="${escapeHtml(String(item.id))}"><audio controls preload="none"></audio></div>`;
            }

            return '';
        }

        function buildMessageHtml(item) {
            try {
                const role = String(item.role || '').toLowerCase();
                const isBot = role === 'model' || role === 'assistant';
                const isOutgoing = item.direction === 'outgoing' || item.fromMe === true;
                const isOperator = isOutgoing || role === 'operator';
                
                let bubbleClass = 'bg-userBubble text-gray-200 px-5 py-6 border border-gray-700/50 rounded-xl rounded-tl-sm shadow-sm text-right';
                let wrapperClass = 'flex justify-start';
                let labelHtml = '';

                if (isBot && !isOutgoing) {
                    bubbleClass = 'bg-operatorBubble text-white px-5 py-4 rounded-xl rounded-tr-sm shadow-sm';
                    wrapperClass = 'flex justify-end';
                    labelHtml = '<div class="text-[11px] font-extrabold text-operatorLabel mb-2 uppercase tracking-wider">AI Bot</div>';
                } else if (isOperator) {
                    bubbleClass = 'bg-operatorBubble text-white px-5 py-4 rounded-xl rounded-tr-sm shadow-sm';
                    wrapperClass = 'flex justify-end';
                    labelHtml = '<div class="text-[11px] font-extrabold text-operatorLabel mb-2 uppercase tracking-wider">Operator</div>';
                } else if (role === 'system') {
                    wrapperClass = 'flex justify-center w-full';
                    bubbleClass = 'bg-yellow-600/20 text-yellow-500 border border-yellow-600/30 px-3 py-2 rounded-md text-sm text-center max-w-[90%]';
                }

                const text = escapeHtml(cleanText(item.text || item.body || ''));
                const audioHtml = buildAudioHtml(item);
                
                let content = '';
                if (labelHtml) content += labelHtml;
                if (audioHtml) content += audioHtml;
                if (text) content += audioHtml ? `<div class="mt-3 text-left">${text}</div>` : text;

                if (!content) return '';

                if (audioHtml && !text) {
                    bubbleClass = isOperator 
                        ? 'bg-operatorBubble p-4 rounded-xl rounded-tr-sm shadow-sm w-[380px] max-w-full'
                        : 'bg-userBubble p-4 border border-gray-700/50 rounded-xl rounded-tl-sm shadow-sm w-[380px] max-w-full';
                }

                return `
                    <div class="${wrapperClass} w-full">
                        <div class="${bubbleClass} min-w-[220px]">
                            ${content}
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error("Message build error:", e);
                return '';
            }
        }

        async function renderHistory(history) {
            if (!messagesEl) return;
            messagesEl.innerHTML = '';
            if (Array.isArray(history)) {
                history.forEach(function(item) {
                    try {
                        var messageHtml = buildMessageHtml(item);
                        if (messageHtml) {
                            messagesEl.insertAdjacentHTML('beforeend', messageHtml);
                        }
                    } catch (e) {}
                });
            }
            scrollToBottomSafe(messagesEl);
            if (typeof hydrateAudioPlayers === 'function') hydrateAudioPlayers();
        }

        async function hydrateAudioPlayers() {
            const wrappers = messagesEl.querySelectorAll('[data-audio-wrapper][data-audio-id]:not([data-audio-loaded])');
            for (const wrapper of wrappers) {
                const player = wrapper.querySelector('audio');
                const messageId = String(wrapper.getAttribute('data-audio-id') || '').trim();
                if (!player || !messageId) continue;
                if (player.getAttribute('src')) {
                    wrapper.setAttribute('data-audio-loaded', '1');
                    continue;
                }
                wrapper.setAttribute('data-audio-loaded', '1');
                try {
                    const result = await fetchJson(`${endpoints.media}/${encodeURIComponent(instanceId)}/${encodeURIComponent(messageId)}`);
                    const mediaType = String(result?.mediaType || 'audio/ogg').split(';')[0].replace(/[^\w/+.-]/g, '');
                    const src = normalizeAudioData(result?.mediaData, mediaType);
                    if (!src) throw new Error('AUDIO_DATA_EMPTY');
                    player.pause();
                    player.removeAttribute('src');
                    player.src = src;
                    player.load();
                } catch (error) {
                    wrapper.removeAttribute('data-audio-loaded');
                    setTimeout(hydrateAudioPlayers, 3000);
                }
            }
        }
        
        function normalizeAudioData(data, type) {
            if(!data) return null;
            return data.startsWith('data:') ? data : `data:${type};base64,${data.replace(/\s+/g, '')}`;
        }

        function updateComposerState() {
            const hasActive = Boolean(activePhone);
            const archived = Boolean(activePhone) && isChatArchived(chats.find(c => c.phone === activePhone));
            inputEl.disabled = !hasActive || isSending || archived;
            sendBtn.disabled = !hasActive || isSending || archived || !inputEl.value.trim();
            inputEl.placeholder = archived ? t('archivedPlaceholder') : t('placeholder');
        }

        function setActiveHeader(phone) {
            const archived = phone ? isChatArchived(chats.find(c => c.phone === phone)) : false;
            const phoneText = phone ? `+${phone}` : t('dialog');
            document.getElementById('active-phone').textContent = phoneText;
            document.getElementById('active-meta').textContent = phone ? (archived ? t('archiveMeta') : t('selectedMeta')) : t('defaultMeta');
        }

        function applyLanguage() {
            document.documentElement.lang = lang === 'ru' ? 'ru' : 'kk';
            document.title = t('title');
            document.getElementById('operator-label').textContent = t('operatorLabel');
            document.getElementById('instance-title').textContent = copy[lang].instanceTitle(instanceId);
            searchInput.placeholder = t('search');
            updateDirectChatButton();
            inputEl.placeholder = t('placeholder');
            for (const button of langToggles) {
                button.textContent = lang === 'kk' ? 'KZ' : 'RU';
                button.title = t('langTitle');
            }
            refreshBtn.title = t('refresh');
            backBtn.title = t('back');
            setActiveHeader(activePhone);
            renderList();
            if (!activePhone) {
                messagesEl.innerHTML = `<div class="h-full flex items-center justify-center text-center text-muted"><div class="grid place-items-center gap-3 max-w-sm"><div class="w-12 h-12 rounded-full bg-[#172338] text-[#8aa3bf] flex items-center justify-center text-xl"><i class="fa-regular fa-comments"></i></div><h2 class="text-lg font-bold text-white">${escapeHtml(t('selectTitle'))}</h2><p class="text-sm">${escapeHtml(t('selectText'))}</p></div></div>`;
            }
            updateComposerState();
        }

        async function fetchJson(url) {
            const response = await fetch(`${apiBase}${url}`, {
                credentials: 'same-origin',
                cache: 'no-store',
                headers: apiHeaders({ Accept: 'application/json' })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `HTTP_${response.status}`);
            return data;
        }

        async function postJson(url, body) {
            const response = await fetch(`${apiBase}${url}`, {
                method: 'POST',
                credentials: 'same-origin',
                cache: 'no-store',
                headers: apiHeaders({ 'content-type': 'application/json' }),
                body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        async function loadInbox(force = false) {
            if (isInboxLoading && !force) return;
            isInboxLoading = true;
            try {
                const result = await fetchJson(`${endpoints.inbox}/${encodeURIComponent(instanceId)}?limit=500`);
                const nextChats = Array.isArray(result?.items) ? result.items : Array.isArray(result?.chats) ? result.chats : [];
                const nextSignature = JSON.stringify(nextChats.map(chat => [chat.phone, chat.updatedAt, chat.lastAt, chat.unread, chat.closed, chat.lastText]));
                chats = nextChats;
                if (nextSignature !== inboxSignature || force) {
                    inboxSignature = nextSignature;
                    renderList();
                }
                if (activePhone && chats.some(chat => normalizePhone(chat.phone) === activePhone)) {
                    await loadHistory(false);
                }
            } finally {
                isInboxLoading = false;
            }
        }

        async function loadHistory(force = false) {
            if (!activePhone || (isHistoryLoading && !force)) return;
            isHistoryLoading = true;
            try {
                const result = await fetchJson(`${endpoints.history}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`);
                const history = Array.isArray(result?.history) ? result.history : Array.isArray(result?.items) ? result.items : [];
                const nextSignature = JSON.stringify(history.map(item => [item.id, item.createdAt, item.timestamp, item.direction, item.fromMe, item.text, item.body, item.type, item.mediaData]));
                if (force || nextSignature !== historySignature) {
                    historySignature = nextSignature;
                    renderHistory(history);
                }
            } finally {
                isHistoryLoading = false;
            }
        }

        function setOperatorLockTtl(ttl) {
            const seconds = Math.max(0, Math.ceil(Number(ttl) || 0));
            operatorLockUntil = seconds > 0 ? Date.now() + seconds * 1000 : 0;
            renderOperatorLock();
        }

        function renderOperatorLock() {
            if (!lockEl) return;
            const remaining = operatorLockUntil ? Math.max(0, Math.ceil((operatorLockUntil - Date.now()) / 1000)) : 0;
            if (activePhone && remaining > 0) {
                lockEl.classList.remove('hidden');
                lockEl.classList.add('flex');
                lockEl.innerHTML = `<i class="fa-solid fa-lock text-[10px]"></i> Оператор: ${remaining}с`;
            } else {
                lockEl.classList.add('hidden');
                lockEl.classList.remove('flex');
            }
        }

        async function loadOperatorLock() {
            if (!activePhone || isLockLoading) {
                renderOperatorLock();
                return;
            }
            isLockLoading = true;
            const requestedPhone = activePhone;
            try {
                const data = await fetchJson(`${endpoints.lock}/${encodeURIComponent(instanceId)}/${encodeURIComponent(requestedPhone)}`);
                if (activePhone === data.phone) setOperatorLockTtl(data.ttl || 0);
            } catch (error) {} finally {
                isLockLoading = false;
            }
        }

        function openChat(phone) {
            activePhone = normalizePhone(phone);
            if (!activePhone) return;
            if (activeTab === 'new') activeTab = 'all';
            
            app.classList.add('chat-open');
            setActiveHeader(activePhone);
            inputEl.style.height = 'auto';
            isSending = false;
            
            const chat = chats.find(c => c.phone === activePhone);
            if (chat) {
                chat.unread = false;
                chat.viewed = true;
            }
            updateComposerState();
            historySignature = '';
            lastViewSyncAt = 0;
            messagesEl.innerHTML = `<div class="h-full flex items-center justify-center text-muted"><p>${escapeHtml(t('loading'))}</p></div>`;
            renderList();
            
            postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { action: 'view' }).then(loadInbox).catch(() => {});
            loadHistory();
            loadOperatorLock();
            if (!isMobile()) inputEl.focus({ preventScroll: true });
        }

        function closeChat() { 
            app.classList.remove('chat-open'); 
            activePhone = ''; 
            operatorLockUntil = 0; 
            renderOperatorLock(); 
            setActiveHeader(''); 
            renderList(); 
        }

        async function runChatAction(action, phone) {
            const cleanPhone = normalizePhone(phone);
            if (!cleanPhone || isResolving) return;
            isResolving = true;
            updateComposerState();
            try {
                await postJson(`${endpoints.action}/${encodeURIComponent(instanceId)}/${encodeURIComponent(cleanPhone)}`, { action });
                if (action === 'close') showToast(t('resolveDone'));
                if (action === 'restore') showToast(t('restoreDone'));
                if (action === 'delete') showToast(t('deleteDone'));
                if (action === 'delete') {
                    chats = chats.filter(chat => normalizePhone(chat.phone) !== cleanPhone);
                } else {
                    const chat = chats.find(item => normalizePhone(item.phone) === cleanPhone);
                    if (chat) chat.closed = action === 'close' ? true : action === 'restore' ? false : chat.closed;
                }
                inboxSignature = '';
                if (activePhone === cleanPhone && (action === 'close' || action === 'delete')) {
                    activePhone = '';
                    app.classList.remove('chat-open');
                    setActiveHeader('');
                    messagesEl.innerHTML = '';
                }
                renderList();
            } catch (err) {
                showToast(t('resolveFailed'));
            } finally {
                isResolving = false;
                loadInbox();
            }
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !activePhone || isSending) return;
            pendingText = text;
            isSending = true;
            
            // Add optimistic UI message exactly like the operator bubble in the Tailwind styling
            messagesEl.insertAdjacentHTML('beforeend', `
                <div class="flex justify-end w-full mb-4">
                    <div class="bg-operatorBubble text-white px-5 py-4 rounded-xl rounded-tr-sm shadow-sm min-w-[220px]">
                        <div class="text-[11px] font-extrabold text-operatorLabel mb-2 uppercase tracking-wider">Operator</div>
                        ${escapeHtml(text)}
                    </div>
                </div>
            `);
            scrollToBottomSafe(messagesEl);
            inputEl.value = '';
            inputEl.style.height = 'auto';
            updateComposerState();

            try {
                await postJson(`${endpoints.send}/${encodeURIComponent(instanceId)}/${encodeURIComponent(activePhone)}`, { text });
                isSending = false;
                pendingText = '';
                updateComposerState();
                const chat = chats.find(c => c.phone === activePhone);
                if (chat) { chat.hasOperator = true; chat.unread = false; }
                setOperatorLockTtl(60);
                activeTab = 'operator';
                loadInbox();
                loadHistory();
                loadOperatorLock();
            } catch (error) {
                isSending = false;
                if (pendingText && !inputEl.value.trim()) inputEl.value = pendingText;
                pendingText = '';
                showToast(t('sendFailed'));
                updateComposerState();
            }
        }

        document.querySelector('.tablist')?.addEventListener('click', event => {
            const button = event.target.closest('.tab');
            if (!button) return;
            activeTab = button.dataset.tab;
            if (activePhone) {
                const chat = chats.find(c => c.phone === activePhone);
                const isArchived = isChatArchived(chat);
                if ((activeTab === 'archive' && !isArchived) || (activeTab !== 'archive' && isArchived)) {
                    activePhone = '';
                    closeChat();
                    setActiveHeader('');
                    messagesEl.innerHTML = '';
                }
            }
            renderList();
        });
        
        // Use generic event delegation for tabs because querySelector may miss dynamically bound ones initially
        document.addEventListener('click', event => {
            const tabBtn = event.target.closest('.tab');
            if(tabBtn && tabBtn.parentElement.getAttribute('role') === 'tablist') {
                 activeTab = tabBtn.dataset.tab;
                 if (activePhone) {
                    const chat = chats.find(c => c.phone === activePhone);
                    const isArchived = isChatArchived(chat);
                    if ((activeTab === 'archive' && !isArchived) || (activeTab !== 'archive' && isArchived)) {
                        activePhone = '';
                        closeChat();
                        setActiveHeader('');
                        messagesEl.innerHTML = '';
                    }
                }
                renderList();
            }
        });

        listEl.addEventListener('click', event => {
            const switchButton = event.target.closest('[data-switch-tab]');
            if (switchButton) {
                activeTab = switchButton.dataset.switchTab;
                renderList();
                return;
            }
            const actionButton = event.target.closest('[data-chat-action]');
            if (actionButton) {
                runChatAction(actionButton.dataset.chatAction, actionButton.dataset.phone);
                return;
            }
            const item = event.target.closest('[data-phone]');
            if (item) openChat(item.dataset.phone);
        });

        searchInput.addEventListener('input', () => renderList());
        searchInput.addEventListener('keydown', event => {
            if (event.key !== 'Enter') return;
            if (!searchPhoneCandidate()) return;
            event.preventDefault();
            openDirectChatFromSearch();
        });

        directChatBtn.addEventListener('click', openDirectChatFromSearch);
        refreshBtn.addEventListener('click', () => {
            inboxSignature = '';
            historySignature = '';
            loadInbox();
            loadHistory();
        });
        
        backBtn.addEventListener('click', closeChat);
        sendBtn.addEventListener('click', sendMessage);

        for (const button of langToggles) button.addEventListener('click', () => {
            lang = lang === 'kk' ? 'ru' : 'kk';
            localStorage.setItem('operator_chat_lang', lang);
            applyLanguage();
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = `${Math.min(inputEl.scrollHeight, 132)}px`;
            updateComposerState();
        });

        inputEl.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        applyLanguage();
        updateComposerState();
        loadInbox();
        
        setInterval(() => {
            loadInbox();
            if (activePhone) {
                loadHistory();
                loadOperatorLock();
            }
        }, 3000);

        setInterval(renderOperatorLock, 1000);
    </script>
</body>
</html>
