<!doctype html>
<html lang="kk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsPro — Ресторан платформасы</title>
<link rel="stylesheet" href="tenants.css">
</head>
<body>
<div class="login-wrap" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-logo" data-ico="logo"></div>
    <h1 data-i18n="login.title">WhatsPro</h1>
    <p class="dim" data-i18n="login.sub"></p>
    <label for="login-user" data-i18n="login.user"></label>
    <input id="login-user" autocomplete="username" required>
    <label for="login-pass" data-i18n="login.pass"></label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <div class="login-error" id="login-error" role="alert" hidden></div>
    <button class="btn primary big" id="login-submit" type="submit" data-i18n="login.submit"></button>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-ico" data-ico="logo"></span>
      <span class="brand-txt"><b>WhatsPro</b><i data-i18n="app.sub"></i></span>
    </div>
    <div class="side-sec" data-i18n="nav.section"></div>
    <nav id="side-nav" aria-label="Main">
      <button class="side-link" data-view="dashboard"><span data-ico="dash"></span><span data-i18n="nav.dashboard"></span></button>
      <button class="side-link" data-view="restaurants"><span data-ico="store"></span><span data-i18n="nav.restaurants"></span><b class="count" id="count-restaurants" hidden></b></button>
      <button class="side-link" data-view="jobs"><span data-ico="jobs"></span><span data-i18n="nav.jobs"></span><b class="count" id="count-jobs" hidden></b></button>
      <button class="side-link" data-view="activity"><span data-ico="activity"></span><span data-i18n="nav.activity"></span></button>
    </nav>
    <div class="side-foot">
      <button class="side-link" id="theme" data-act="theme"><span data-ico="theme"></span><span data-i18n="nav.theme"></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="burger" aria-label="Menu"><span data-ico="menu"></span></button>
      <div class="search">
        <span class="s-ico" data-ico="search"></span>
        <input id="search" data-i18n-ph="top.search.ph" autocomplete="off">
        <button class="icon-btn" id="search-clear" hidden aria-label="Clear">&times;</button>
      </div>
      <div class="top-actions">
        <span class="jobs-pill" id="jobs-pill" hidden><span class="dot"></span><span id="jobs-pill-text"></span></span>
        <select id="lang" aria-label="Language"></select>
        <button class="icon-btn" id="refresh" data-act="refresh" aria-label="Refresh"><span data-ico="refresh"></span></button>
        <div class="who"><span class="avatar" id="avatar">A</span><span id="who"></span></div>
        <button class="icon-btn" id="logout" data-act="logout" aria-label="Logout"><span data-ico="logout"></span></button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-host"></div>
<script src="tenants.js"></script>
</body>
</html>
