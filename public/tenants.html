<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c0f">
  <title>WhatsPro — Нысандарды басқару</title>
  <link rel="stylesheet" href="/tenants.css">
</head>
<body>
  <main class="login-shell" id="login-shell" hidden>
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <span class="login-brand-mark"><svg aria-hidden="true"><use href="#i-store"></use></svg></span>
        <div>
          <strong>WhatsPro</strong>
          <span id="login-platform-label">Бизнес платформасы</span>
        </div>
      </div>
      <div class="login-copy">
        <span class="login-eyebrow" id="login-eyebrow">ҚАУІПСІЗ КІРУ</span>
        <h1 id="login-title">Әкімші панеліне кіру</h1>
        <p id="login-description">Нысандарды, WhatsApp сессияларын және боттарды басқару үшін кіріңіз.</p>
      </div>
      <form class="login-form" id="login-form" novalidate>
        <div class="field">
          <label for="login-username" id="login-username-label">Логин</label>
          <div class="input-with-icon">
            <svg aria-hidden="true"><use href="#i-user"></use></svg>
            <input id="login-username" name="username" type="text" autocomplete="username" required aria-required="true">
          </div>
        </div>
        <div class="field">
          <label for="login-password" id="login-password-label">Құпиясөз</label>
          <div class="input-with-icon">
            <svg aria-hidden="true"><use href="#i-lock"></use></svg>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required aria-required="true">
          </div>
        </div>
        <label class="checkbox login-remember" for="login-remember">
          <input id="login-remember" name="remember" type="checkbox">
          <span id="login-remember-label">Логин мен сессияны сақтау</span>
        </label>
        <p class="login-error" id="login-error" role="alert" aria-live="assertive" hidden></p>
        <button class="button primary login-submit" id="login-submit" type="submit">
          <span id="login-submit-label">Кіру</span>
          <svg aria-hidden="true"><use href="#i-arrow"></use></svg>
        </button>
      </form>
      <div class="login-foot">
        <span class="health-mark"><i></i></span>
        <span id="login-foot-label">Қорғалған әкімші кеңістігі</span>
      </div>
    </section>
  </main>

  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <button class="icon-button menu-toggle" id="sidebar-toggle" type="button" aria-label="Бүйірлік панельді жинау">
          <svg aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <div class="brand-copy">
          <strong>WhatsPro</strong>
          <span id="brand-subtitle">Бизнес платформасы</span>
        </div>
      </div>

      <div class="nav-label">Жұмыс кеңістігі</div>
      <nav class="main-nav" aria-label="Негізгі навигация">
        <button class="nav-item active" type="button" data-view="dashboard">
          <svg aria-hidden="true"><use href="#i-grid"></use></svg>
          <span id="nav-dashboard">Басқару панелі</span>
        </button>
        <button class="nav-item" type="button" data-view="restaurants">
          <svg aria-hidden="true"><use href="#i-store"></use></svg>
          <span id="nav-restaurants">Нысандар</span>
          <b class="nav-count" id="restaurant-count">—</b>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="focus-mode" type="button">
          <svg aria-hidden="true"><use href="#i-moon"></use></svg>
          <span id="theme-label">Жарық режим</span>
          <i class="status-dot"></i>
        </button>
        <div class="workspace-health">
          <span class="health-mark"><i></i></span>
          <span><strong id="gateway-label">Gateway қолжетімді</strong><small id="last-sync">Тексерілуде…</small></span>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Навигацияны ашу">
          <svg aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <label class="global-search">
          <svg aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="global-search" type="search" autocomplete="off" placeholder="Нысан, instance немесе телефон іздеу…">
          <kbd>⌘ K</kbd>
        </label>
        <div class="topbar-actions">
          <button class="button" id="workspace-button" type="button" aria-haspopup="dialog">
            <svg aria-hidden="true"><use href="#i-lock"></use></svg>
            <span>Жұмыс кеңістігі</span>
          </button>
          <div class="locale-wrap">
          <button class="text-button locale-button" id="locale-button" type="button" aria-label="Тілді ауыстыру" aria-expanded="false">
            <span>ҚАЗ</span>
          </button>
          </div>
          <button class="icon-button" id="refresh-button" type="button" aria-label="Деректерді жаңарту">
            <svg aria-hidden="true"><use href="#i-refresh"></use></svg>
          </button>
          <div class="profile-wrap">
            <button class="profile-button" id="profile-button" type="button" aria-expanded="false">
              <span class="avatar">AD</span>
              <span class="profile-copy"><strong id="profile-name">Әкімші</strong><small id="profile-role">Иесі</small></span>
              <svg aria-hidden="true"><use href="#i-chevron"></use></svg>
            </button>
            <div class="profile-menu popover" id="profile-menu" hidden>
              <div class="profile-menu-head"><strong id="profile-workspace">Әкімші панелі</strong><span id="profile-session">Қауіпсіз сессия</span></div>
              <button type="button" data-profile-action="refresh"><svg><use href="#i-refresh"></use></svg><span id="profile-refresh">Деректерді жаңарту</span></button>
              <button type="button" data-profile-action="export"><svg><use href="#i-download"></use></svg><span id="profile-export">Excel-ге экспорттау</span></button>
              <button type="button" data-profile-action="import"><svg><use href="#i-upload"></use></svg><span id="profile-import">Excel-ден қалпына келтіру</span></button>
              <button type="button" data-profile-action="logout"><svg><use href="#i-logout"></use></svg><span id="profile-logout">Шығу</span></button>
            </div>
          </div>
        </div>
      </header>

      <main id="view" tabindex="-1">
        <div class="page-loading" aria-live="polite">
          <span class="skeleton w-40"></span>
          <span class="skeleton w-64"></span>
          <div class="loading-grid"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div>
        </div>
      </main>
    </div>
  </div>

  <div class="mobile-scrim" id="mobile-scrim" hidden></div>
  <input id="tenant-import-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div id="modal-root"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h16"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6"/><path d="M3 10c0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0M9 20v-5h6v5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 15.5A8 8 0 0 1 8.5 5 8 8 0 1 0 19 15.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M18 10a7 7 0 0 0-12-3L4 9m2 5a7 7 0 0 0 12 3l2-2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M7 6.5a8 8 0 1 0 10 0"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 3v5M16 3v5M6 8h12v2a6 6 0 0 1-6 6v5M9 21h6"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l3.5-1 11-11a2 2 0 0 0-3-3l-11 11L4 20Z"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M5 8V4m0 0h4M5 4l3 3a7 7 0 1 1-1.5 8"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6M8 12H6a4 4 0 0 1 0-8h4a4 4 0 0 1 3.5 2M16 12h2a4 4 0 0 1 0 8h-4a4 4 0 0 1-3.5-2"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM19 14h1v3h-3v3h-3v-2M19 19h1v1h-1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5H5v11h3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0 5 5m-5-5-5 5M5 20h14"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 16l.6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6L19 16Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  </svg>
  <script src="/tenants.js"></script>
</body>
</html>
